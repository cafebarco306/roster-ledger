  function normName(n) { return String(n || "").trim().toLowerCase().replace(/\s+/g, " "); }
  function entryCount(code) { return (state.availByCode[code] || []).length; }

  // Groups of staff rows that share the same name (ignoring capitals/spaces).
  function duplicateGroups(staff) {
    var by = {}, order = [];
    staff.forEach(function (s) {
      var k = normName(s.name);
      if (!k) return;
      if (!by[k]) { by[k] = []; order.push(k); }
      by[k].push(s);
    });
    return order.filter(function (k) { return by[k].length > 1; }).map(function (k) {
      var rows = by[k].slice().sort(function (a, b) {
        return (entryCount(b.code) - entryCount(a.code)) || ((a.createdAt || 0) - (b.createdAt || 0));
      });
      return { key: k, keep: rows[0], others: rows.slice(1) };
    });
  }

  function renderDuplicateBanner(staff) {
    var groups = duplicateGroups(staff);
    if (!groups.length) return "";
    return '<div class="dup-box">' +
      '<strong>⚠ ' + groups.length + ' ' + (groups.length === 1 ? "person has" : "people have") + ' more than one row</strong>' +
      '<p class="muted" style="margin:4px 0 8px;">This usually happens when someone created a new code in the old version of the app. Merging moves every entry into one code and removes the extra codes. Tip: download Excel (All dates with entries) first as a backup.</p>' +
      groups.map(function (g) {
        var confirming = state.confirmMergeGroup === g.key;
        var list = [g.keep].concat(g.others).map(function (s) {
          return '<span class="scode">' + escapeHtml(s.code) + '</span> (' + entryCount(s.code) + ')';
        }).join(", ");
        return '<div class="dup-row"><span><strong>' + escapeHtml(g.keep.name) + '</strong> — ' + list + '</span>' +
          (confirming
            ? '<span class="srow-right"><button class="btn btn-danger btn-sm" data-merge-group-confirm="' + escapeHtml(g.key) + '">Merge into ' + escapeHtml(g.keep.code) + ' and remove ' + g.others.map(function (o) { return escapeHtml(o.code); }).join(", ") + '</button>' +
              '<button class="btn btn-ghost btn-sm" data-merge-cancel="1">Cancel</button></span>'
            : '<button class="btn btn-primary btn-sm" data-merge-group="' + escapeHtml(g.key) + '">Merge into ' + escapeHtml(g.keep.code) + '</button>') +
          '</div>';
      }).join("") +
    '</div>';
  }

  function renderStaffRow(s, staff) {
    var count = entryCount(s.code);
    var head = '<span>' + escapeHtml(s.name) + ' <span class="scode">' + escapeHtml(s.code) + '</span></span>';
    var right;
    if (state.confirmRemove === s.code) {
      right = '<button class="btn btn-danger btn-sm" data-remove-confirm="' + escapeHtml(s.code) + '">Remove ' + escapeHtml(s.name) + ' and their entries</button>' +
        '<button class="btn btn-ghost btn-sm" data-remove-cancel="1">Cancel</button>';
    } else if (state.mergeFrom === s.code) {
      var others = staff.filter(function (o) { return o.code !== s.code; });
      right = '<label class="sr-only" for="mergeInto">Merge into</label>' +
        '<select id="mergeInto" class="merge-select">' +
          '<option value="">Move entries into…</option>' +
          others.map(function (o) {
            return '<option value="' + escapeHtml(o.code) + '"' + (state.mergeInto === o.code ? " selected" : "") + '>' + escapeHtml(o.name) + ' (' + escapeHtml(o.code) + ')</option>';
          }).join("") +
        '</select>' +
        '<button class="btn btn-danger btn-sm" id="btnMergeConfirm"' + (state.mergeInto ? "" : " disabled") + '>Merge &amp; remove ' + escapeHtml(s.code) + '</button>' +
        '<button class="btn btn-ghost btn-sm" data-merge-cancel="1">Cancel</button>';
    } else {
      right = '<span class="muted">' + count + ' ' + (count === 1 ? "entry" : "entries") + '</span>' +
        (staff.length > 1 ? '<button class="btn btn-ghost btn-sm" data-merge-from="' + escapeHtml(s.code) + '">Merge…</button>' : '') +
        '<button class="btn btn-ghost btn-sm" data-remove="' + escapeHtml(s.code) + '">Remove</button>';
    }
    return '<div class="srow">' + head + '<span class="srow-right">' + right + '</span></div>';
  }

  function exportOption(val, label) {
    return '<option value="' + val + '"' + (state.exportRange === val ? " selected" : "") + '>' + label + '</option>';
  }

  function renderDashboard() {
    var days = [];
    for (var i = 0; i < 7; i++) days.push(addDays(state.weekStart, i));
    var weekLabel = days[0].toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " – " +
      days[6].toLocaleDateString(undefined, { month: "short", day: "numeric" });

    var staff = state.staffDocs.slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });

    var totalEntries = 0;
    Object.keys(state.availByCode).forEach(function (c) { totalEntries += (state.availByCode[c] || []).length; });

    var headRow = '<tr><th>Staff</th>' + days.map(function (d) {
      return '<th class="dayhead">' + DAY_NAMES[(d.getDay() + 6) % 7] + '<br><span class="daynum">' + formatDayNum(d) + '</span></th>';
    }).join("") + '</tr>';

    var viewShifts = state.adminShift === "both" ? SHIFTS : [SHIFT_BY_ID[state.adminShift] || SHIFTS[0]];
    var bodyRows = staff.length ? staff.map(function (s) {
      var all = state.availByCode[s.code] || [];
      var perShift = viewShifts.map(function (sh) { return { sh: sh, entries: entriesForShift(all, sh.id) }; });
      var cells = days.map(function (d) {
        var iso = toISODate(d);
        var html = perShift.map(function (ps) {
          var dayEntries = ps.entries.filter(function (e) { return e.date === iso; }).sort(byDateThenStart);
          var tag = viewShifts.length > 1 ? '<span class="shift-tag">' + escapeHtml(ps.sh.short) + '</span>' : '';
          if (!dayEntries.length) return viewShifts.length > 1 ? '<div class="cell-entry">' + tag + '<span class="cell-empty">–</span></div>' : '';
          return dayEntries.map(function (e) {
            var timeStr = entryTimeLabel(e);
            var title = ps.sh.label + ": " + STATUS_LABEL[e.status] + (timeStr ? " (" + timeStr + ")" : "") + (e.note ? " — " + e.note : "");
            return '<div class="cell-entry" title="' + escapeHtml(title) + '">' + tag + '<span class="pill ' + pillClassFor(e.status) + '"><span class="pill-dot"></span>' + STATUS_SHORT_LABEL[e.status] + '</span>' +
              (e.allDay ? '' : '<span class="entry-time">' + escapeHtml(timeStr) + '</span>') +
              (e.status === "partial" && e.note ? '<span class="cell-note">' + escapeHtml(e.note.length > 60 ? e.note.slice(0, 58) + "…" : e.note) + '</span>' : '') + '</div>';
          }).join("");
        }).join("");
        if (!html) return '<td class="cell"><span class="cell-empty">–</span></td>';
        return '<td class="cell">' + html + '</td>';
      }).join("");
      return '<tr><td class="name-cell">' + escapeHtml(s.name) + '</td>' + cells + '</tr>';
    }).join("") : '<tr><td colspan="8" class="empty">No staff yet. Add people in the Staff section below, then give each person their code.</td></tr>';

    return (
      '<div class="card">' +
        '<div class="toprow">' +
          '<h2 style="margin:0;">Overview</h2>' +
          '<div class="export-bar">' +
            '<select id="selExportRange" aria-label="Weeks to include">' +
              exportOption("1", "Week shown below") +
              exportOption("4", "4 weeks from week shown") +
              exportOption("8", "8 weeks from week shown") +
              exportOption("all", "All dates with entries") +
            '</select>' +
            '<button class="btn btn-primary btn-sm" id="btnExportXlsx"' + (state.exporting ? ' disabled' : '') + '>' + (state.exporting ? "Preparing…" : "⬇ Download Excel") + '</button>' +
          '</div>' +
        '</div>' +
        (state.exportError ? '<div class="banner error" style="margin-top:10px;">' + escapeHtml(state.exportError) + '</div>' : '') +
        '<div class="stat-row" style="margin-top:14px;">' +
          '<div class="stat"><div class="num">' + staff.length + '</div><div class="lbl">Staff members</div></div>' +
          '<div class="stat"><div class="num">' + totalEntries + '</div><div class="lbl">Availability entries logged</div></div>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="week-nav">' +
          '<button class="icon-btn" id="btnPrevWeek" aria-label="Previous week">‹</button>' +
          '<span class="label">' + weekLabel + '</span>' +
          '<button class="icon-btn" id="btnNextWeek" aria-label="Next week">›</button>' +
        '</div>' +
        '<div class="segmented grid-shift" role="tablist" aria-label="Shift" style="margin-top:12px;">' +
          [{ id: "both", label: "Both shifts" }].concat(SHIFTS.map(function (sh) { return { id: sh.id, label: sh.label + " · " + sh.hours }; })).map(function (o) {
            return '<button type="button" data-admin-shift="' + o.id + '" class="' + (state.adminShift === o.id ? "active" : "") + '">' + escapeHtml(o.label) + '</button>';
          }).join("") +
        '</div>' +
        '<div class="grid-wrap" style="margin-top:14px;">' +
          '<table class="roster"><thead>' + headRow + '</thead><tbody>' + bodyRows + '</tbody></table>' +
        '</div>' +
        '<div class="legend" style="margin-top:12px;">' +
          '<span><span class="swatch" style="background:var(--available);"></span>Available</span>' +
          '<span><span class="swatch" style="background:var(--unavailable);"></span>Unavailable</span>' +
          '<span><span class="swatch" style="background:var(--partial);"></span>Partial (note shown)</span>' +
          '<span>Hover a cell for notes</span>' +
        '</div>' +
      '</div>' +

      renderImportCard() +

      '<div class="card">' +
        '<h2>Staff</h2>' +
        '<p class="muted">Add each person here and give them their code. Staff can only sign in with a code you\'ve created.</p>' +
        (state.adminMsg ? '<div class="banner' + (state.adminMsgError ? ' error' : '') + '" style="margin-top:10px;">' + escapeHtml(state.adminMsg) + '</div>' : '') +
        '<form id="formAddStaff" style="margin-top:14px;">' +
          '<div class="row">' +
            '<div class="field"><label for="addName">Name</label><input type="text" id="addName" placeholder="e.g. Priya Nair" required maxlength="60"></div>' +
            '<div class="field"><label for="addCode">Code (optional)</label><input type="text" id="addCode" placeholder="Blank = random" maxlength="16" style="font-family:var(--mono);letter-spacing:0.08em;text-transform:uppercase;"></div>' +
          '</div>' +
          '<span class="muted" style="font-size:0.78rem;">Codes are 4–16 letters or numbers and must be unique. Leave blank to generate one.</span>' +
          '<div class="row"><button type="submit" class="btn btn-primary">Add staff member</button></div>' +
        '</form>' +
        renderDuplicateBanner(staff) +
        '<div class="staff-roster" style="margin-top:16px;">' + (staff.length ? staff.map(function (s) { return renderStaffRow(s, staff); }).join("") : '<p class="muted">No staff yet.</p>') + '</div>' +
      '</div>' +

      '<div class="card">' +
        '<button class="link-btn" id="btnLockOwner">Lock admin view</button>' +
      '</div>'
    );
  }

  // ---------- event binding ----------
  function bindHandlers() {
    var el;

    if ((el = document.getElementById("btnSwitchStaff"))) el.onclick = function () {
      safeDel("roster_staff_code"); safeDel("roster_staff_name");
      unsubStaffEditor();
      state.staffCode = null; state.staffName = null; state.staffScreen = "enter-code"; state.formError = "";
      render();
    };

    if ((el = document.getElementById("formCode"))) el.onsubmit = onSubmitCode;
    if ((el = document.getElementById("formEntry"))) el.onsubmit = onSubmitEntry;
    document.querySelectorAll("[data-shift-tab]").forEach(function (b) {
      // Unsaved picked dates carry over when switching shift.
      b.onclick = function () { state.staffShift = b.getAttribute("data-shift-tab"); state.editingId = null; state.formError = ""; state.formMsg = ""; state.replaceExisting = false; state.entryDraft = null; state.fieldErrors = null; render(); };
    });
    if ((el = document.getElementById("btnCancelEdit"))) el.onclick = function () { state.editingId = null; state.entryDraft = null; state.fieldErrors = null; state.formError = ""; render(); };
    document.querySelectorAll("[data-reuse-shift]").forEach(function (b) {
      b.onclick = function () {
        var picks = {};
        (state.lastDates || []).forEach(function (d) { picks[d] = true; });
        state.pickDates = picks;
        if (state.lastDates && state.lastDates.length) state.calMonth = firstOfMonth(new Date(state.lastDates[0] + "T00:00:00"));
        state.staffShift = b.getAttribute("data-reuse-shift");
        state.lastDates = null; state.formMsg = ""; state.formError = ""; state.replaceExisting = false;
        state.editingId = null; state.entryDraft = null; state.fieldErrors = null;
        render();
      };
    });
    if ((el = document.getElementById("calBox"))) {
      el.onclick = onCalendarClick;
      el.onchange = function (ev) { if (ev.target.id === "chkReplace") state.replaceExisting = ev.target.checked; };
    }
    document.querySelectorAll('input[name="fStatus"]').forEach(function (r) {
      r.onchange = function () {
        document.querySelectorAll(".status-opt").forEach(function (o) { o.className = "status-opt"; });
        this.closest(".status-opt").className = "status-opt sel-" + this.value;
        document.getElementById("partialBox").style.display = this.value === "partial" ? "flex" : "none";
        if (this.value === "partial") document.getElementById("fNote").focus();
      };
    });
    if ((el = document.getElementById("chkShowPast"))) el.onchange = function () { state.showPast = this.checked; render(); };

    document.querySelectorAll("[data-edit]").forEach(function (b) {
      b.onclick = function () { state.editingId = b.getAttribute("data-edit"); state.entryDraft = null; state.fieldErrors = null; state.formError = ""; state.formMsg = ""; render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    });
    document.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () { deleteEntry(b.getAttribute("data-del")); };
    });

    if ((el = document.getElementById("formSetupPin"))) el.onsubmit = onSubmitSetupPin;
    if ((el = document.getElementById("formPin"))) el.onsubmit = onSubmitPin;
    if ((el = document.getElementById("btnForgotPin"))) el.onclick = function () { state.ownerScreen = "forgot"; state.formError = ""; render(); };
    if ((el = document.getElementById("btnRetryOwner"))) el.onclick = function () { state.ownerScreen = "loading"; state.dbError = ""; render(); ensureOwnerFlow(); };
    if ((el = document.getElementById("btnBackToPin"))) el.onclick = function () { state.ownerScreen = "pin"; state.formError = ""; render(); };
    if ((el = document.getElementById("formForgot"))) el.onsubmit = onSubmitForgot;
    if ((el = document.getElementById("formResetPin"))) el.onsubmit = onSubmitResetPin;
    if ((el = document.getElementById("btnLockOwner"))) el.onclick = function () {
      lockAdmin("");
    };
    document.querySelectorAll("[data-admin-shift]").forEach(function (b) {
      b.onclick = function () { state.adminShift = b.getAttribute("data-admin-shift"); render(); };
    });
    if ((el = document.getElementById("btnPrevWeek"))) el.onclick = function () { state.weekStart = addDays(state.weekStart, -7); render(); };
    if ((el = document.getElementById("btnNextWeek"))) el.onclick = function () { state.weekStart = addDays(state.weekStart, 7); render(); };
    if ((el = document.getElementById("selExportRange"))) el.onchange = function () { state.exportRange = this.value; };
    if ((el = document.getElementById("btnExportXlsx"))) el.onclick = exportXlsx;
    if ((el = document.getElementById("formAddStaff"))) el.onsubmit = onSubmitAddStaff;
    bindImportHandlers();
    document.querySelectorAll("[data-remove]").forEach(function (b) {
      b.onclick = function () { clearStaffActions(); state.confirmRemove = b.getAttribute("data-remove"); render(); };
    });
    document.querySelectorAll("[data-merge-group]").forEach(function (b) {
      b.onclick = function () { clearStaffActions(); state.confirmMergeGroup = b.getAttribute("data-merge-group"); render(); };
    });
    document.querySelectorAll("[data-merge-group-confirm]").forEach(function (b) {
      b.onclick = function () {
        var key = b.getAttribute("data-merge-group-confirm");
        var g = duplicateGroups(state.staffDocs).filter(function (x) { return x.key === key; })[0];
        if (g) mergeStaff(g.others.map(function (o) { return o.code; }), g.keep.code, bestName([g.keep].concat(g.others)));
      };
    });
    document.querySelectorAll("[data-merge-from]").forEach(function (b) {
      b.onclick = function () { clearStaffActions(); state.mergeFrom = b.getAttribute("data-merge-from"); render(); };
    });
    document.querySelectorAll("[data-merge-cancel]").forEach(function (b) {
      b.onclick = function () { clearStaffActions(); render(); };
    });
    var mi = document.getElementById("mergeInto");
    if (mi) mi.onchange = function () { state.mergeInto = this.value; render(); };
    var mc = document.getElementById("btnMergeConfirm");
    if (mc) mc.onclick = function () { if (state.mergeFrom && state.mergeInto) mergeStaff([state.mergeFrom], state.mergeInto); };
    document.querySelectorAll("[data-remove-cancel]").forEach(function (b) {
      b.onclick = function () { clearStaffActions(); render(); };
    });
    document.querySelectorAll("[data-remove-confirm]").forEach(function (b) {
      b.onclick = function () { removeStaff(b.getAttribute("data-remove-confirm")); };
    });
  }

  // ---------- Excel (.xlsx) export ----------
  // Builds the same week grid as the dashboard (staff down the side, days
  // across the top, colour-coded Available / Unavailable), one sheet per
  // week, plus an "All entries" sheet listing every entry line by line.
  var EXCELJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
  var XL = {
    ink: "FF16211F", dim: "FF55645F", faint: "FF8B968F", line: "FFD7DCD4",
    head: "FFF5F6F2", accent: "FF2F6F5E", accentSoft: "FFE2EEE9",
    avail: "FFB4791E", availSoft: "FFF6E9D2", unavail: "FFA6432F", unavailSoft: "FFF5DFD8",
    partial: "FF3F6FA0", partialSoft: "FFDDE7F2"
  };
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  var excelLoading = null;
  function loadExcelJS() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (excelLoading) return excelLoading;
    excelLoading = new Promise(function (resolve, reject) {
      var sc = document.createElement("script");
      sc.src = EXCELJS_URL;
      sc.onload = function () { window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error("ExcelJS missing")); };
      sc.onerror = function () { excelLoading = null; reject(new Error("load failed")); };
      document.head.appendChild(sc);
    });
    return excelLoading;
  }

  function shortDate(d) { return d.getDate() + " " + MONTHS[d.getMonth()]; }
  function longDate(d) { return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); }
  function isoToDate(iso) { var p = iso.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function sortedStaff() {
    return state.staffDocs.slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });
  }
  function byDateThenStart(a, b) {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    var as = a.allDay ? "" : (a.start || ""), bs = b.allDay ? "" : (b.start || "");
    return as < bs ? -1 : as > bs ? 1 : 0;
  }

  function exportWeekStarts(range, staff) {
    var starts = [];
    if (range === "all") {
      var min = null, max = null;
      staff.forEach(function (s) {
        (state.availByCode[s.code] || []).forEach(function (e) {
          if (!e.date) return;
          if (!min || e.date < min) min = e.date;
          if (!max || e.date > max) max = e.date;
        });
      });
      if (!min) return [state.weekStart];
      var w = startOfWeek(isoToDate(min)), last = startOfWeek(isoToDate(max));
      while (w <= last && starts.length < 104) { starts.push(w); w = addDays(w, 7); }
      return starts;
    }
    var n = parseInt(range, 10) || 1;
    for (var i = 0; i < n; i++) starts.push(addDays(state.weekStart, 7 * i));
    return starts;
  }

  function xlColor(st) { return st === "available" ? XL.avail : st === "partial" ? XL.partial : XL.unavail; }
  function xlSoft(st) { return st === "available" ? XL.availSoft : st === "partial" ? XL.partialSoft : XL.unavailSoft; }
  function thinBorder() {
    var b = { style: "thin", color: { argb: XL.line } };
    return { top: b, left: b, bottom: b, right: b };
  }
  function fill(argb) { return { type: "pattern", pattern: "solid", fgColor: { argb: argb } }; }

  // One sheet per shift. Each selected week is a block: a week title row, the
  // STAFF / Mon…Sun header row, then one row per staff member.
  function addShiftSheet(wb, shift, weekStarts, staff) {
    var ws = wb.addWorksheet(shift.label, {
      views: [{ state: "frozen", xSplit: 1, ySplit: 0, showGridLines: false }],
      pageSetup: { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 }
    });
    ws.columns = [{ width: 24 }, { width: 22 }, { width: 22 }, { width: 22 }, { width: 22 }, { width: 22 }, { width: 22 }, { width: 22 }];

    ws.mergeCells(1, 1, 1, 8);
    var t = ws.getCell(1, 1);
    t.value = "Roster Ledger — " + shift.label + " (" + shift.hours + ")";
    t.font = { name: "Calibri", size: 16, bold: true, color: { argb: XL.ink } };
    ws.getRow(1).height = 26;
    ws.mergeCells(2, 1, 2, 8);
    var sub = ws.getCell(2, 1);
    sub.value = weekStarts.length + (weekStarts.length === 1 ? " week" : " weeks") + " from " + longDate(weekStarts[0]) + "    ·    Exported " + longDate(new Date());
    sub.font = { name: "Calibri", size: 10, color: { argb: XL.dim } };

    var r = 4;
    weekStarts.forEach(function (weekStart) {
      var days = [];
      for (var i = 0; i < 7; i++) days.push(addDays(weekStart, i));

      ws.mergeCells(r, 1, r, 8);
      var wt = ws.getCell(r, 1);
      wt.value = "Week of " + longDate(weekStart) + "  (" + shortDate(days[0]) + " – " + longDate(days[6]) + ")";
      wt.font = { name: "Calibri", size: 12, bold: true, color: { argb: XL.accent } };
      ws.getRow(r).height = 20;
      r++;

      var head = ws.getRow(r);
      head.height = 32;
      head.getCell(1).value = "STAFF";
      days.forEach(function (d, i) {
        head.getCell(i + 2).value = DAY_NAMES[(d.getDay() + 6) % 7].toUpperCase() + "\n" + shortDate(d) + " " + d.getFullYear();
      });
      for (var c = 1; c <= 8; c++) {
        var hc = head.getCell(c);
        hc.font = { name: "Calibri", size: 10, bold: true, color: { argb: XL.dim } };
        hc.fill = fill(XL.head);
        hc.border = thinBorder();
        hc.alignment = { horizontal: c === 1 ? "left" : "center", vertical: "middle", wrapText: true };
      }
      r++;

      if (!staff.length) {
        ws.mergeCells(r, 1, r, 8);
        var ec = ws.getCell(r, 1);
        ec.value = "No staff yet.";
        ec.font = { italic: true, color: { argb: XL.faint } };
        ec.alignment = { horizontal: "center" };
        r++;
      }
      staff.forEach(function (s) {
        var entries = entriesForShift(state.availByCode[s.code] || [], shift.id);
        var row = ws.getRow(r);
        var nameCell = row.getCell(1);
        nameCell.value = s.name || s.code;
        nameCell.font = { name: "Calibri", size: 11, bold: true, color: { argb: XL.ink } };
        nameCell.fill = fill(XL.head);
        nameCell.border = thinBorder();
        nameCell.alignment = { vertical: "top", wrapText: true };
        var maxLines = 1;
        days.forEach(function (d, i) {
          var iso = toISODate(d);
          var dayEntries = entries.filter(function (e) { return e.date === iso; }).sort(byDateThenStart);
          var cell = row.getCell(i + 2);
          cell.border = thinBorder();
          if (!dayEntries.length) {
            cell.value = "–";
            cell.font = { color: { argb: XL.faint } };
            cell.alignment = { horizontal: "center", vertical: "top" };
            return;
          }
          var runs = [], lines = 0, statuses = {};
          dayEntries.forEach(function (e, idx) {
            statuses[e.status] = true;
            var col = xlColor(e.status);
            if (idx > 0) runs.push({ text: "\n" });
            runs.push({ text: STATUS_SHORT_LABEL[e.status] || e.status, font: { name: "Calibri", size: 10, bold: true, color: { argb: col } } });
            var tl = entryTimeLabel(e);
            lines += 1;
            if (tl) { runs.push({ text: "\n" + tl, font: { name: "Calibri", size: 10, color: { argb: XL.ink } } }); lines += 1; }
            if (e.note) {
              runs.push({ text: "\nNote: " + e.note, font: { name: "Calibri", size: 9, italic: e.status !== "partial", color: { argb: e.status === "partial" ? XL.ink : XL.dim } } });
              lines += Math.ceil(e.note.length / 26);
            }
          });
          cell.value = { richText: runs };
          cell.alignment = { vertical: "top", wrapText: true };
          var keys = Object.keys(statuses);
          if (keys.length === 1) cell.fill = fill(xlSoft(keys[0]));
          if (lines > maxLines) maxLines = lines;
        });
        row.height = Math.max(20, maxLines * 14 + 6);
        r++;
      });
      r++; // gap between weeks
    });

    ws.getCell(r, 1).value = "Legend";
    ws.getCell(r, 1).font = { bold: true, size: 10, color: { argb: XL.dim } };
    STATUS_ORDER.forEach(function (st, i) {
      var lc = ws.getCell(r, 2 + i);
      lc.value = STATUS_SHORT_LABEL[st];
      lc.fill = fill(xlSoft(st)); lc.font = { bold: true, size: 10, color: { argb: xlColor(st) } };
      lc.border = thinBorder(); lc.alignment = { horizontal: "center" };
    });
    ws.getCell(r + 1, 1).value = "– = nothing entered for that day.  “Whole shift” = " + shift.hours + ".  Partial always has a note saying what the person can do.";
    ws.getCell(r + 1, 1).font = { size: 9, italic: true, color: { argb: XL.faint } };
  }

  function addEntriesSheet(wb, staff) {
    var ws = wb.addWorksheet("All entries", { views: [{ state: "frozen", ySplit: 1 }] });
    ws.columns = [
      { header: "Staff Name", key: "name", width: 24 },
      { header: "Code", key: "code", width: 12 },
      { header: "Shift", key: "shift", width: 17 },
      { header: "Date", key: "date", width: 16, style: { numFmt: "ddd d mmm yyyy" } },
      { header: "Whole Shift", key: "allDay", width: 12 },
      { header: "Start", key: "start", width: 11 },
      { header: "End", key: "end", width: 11 },
      { header: "Status", key: "status", width: 13 },
      { header: "Note", key: "note", width: 44 }
    ];
    ws.getRow(1).eachCell(function (c) {
      c.font = { bold: true, color: { argb: "FFFFFFFF" } };
      c.fill = fill(XL.accent);
      c.border = thinBorder();
    });
    staff.forEach(function (s) {
      var all = state.availByCode[s.code] || [];
      var rows = [];
      SHIFTS.forEach(function (sh) { entriesForShift(all, sh.id).forEach(function (e) { rows.push(e); }); });
      rows.sort(function (a, b) {
        return byDateThenStart(a, b) || (SHIFTS.indexOf(SHIFT_BY_ID[a.shift]) - SHIFTS.indexOf(SHIFT_BY_ID[b.shift]));
      });
      rows.forEach(function (e) {
        var p = (e.date || "").split("-");
        var row = ws.addRow({
          name: s.name, code: s.code, shift: SHIFT_BY_ID[e.shift].label,
          date: p.length === 3 ? new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])) : e.date,
          allDay: e.allDay ? "Yes" : "No",
          start: e.allDay || !e.start ? "" : formatTime(e.start), end: e.allDay || !e.end ? "" : formatTime(e.end),
          status: STATUS_SHORT_LABEL[e.status] || e.status, note: e.note || ""
        });
        row.eachCell({ includeEmpty: true }, function (c) { c.border = thinBorder(); c.alignment = { vertical: "top", wrapText: true }; });
        var st = row.getCell("status");
        st.fill = fill(xlSoft(e.status));
        st.font = { bold: true, color: { argb: xlColor(e.status) } };
      });
    });
    ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: 9 } };
  }

  function exportXlsx() {
    state.exportError = "";
    state.exporting = true;
    render();
    loadExcelJS().then(function (ExcelJS) {
      var staff = sortedStaff();
      var wb = new ExcelJS.Workbook();
      wb.creator = "Roster Ledger";
      wb.created = new Date();
      var starts = exportWeekStarts(state.exportRange, staff);
      SHIFTS.forEach(function (sh) { addShiftSheet(wb, sh, starts, staff); });
      addEntriesSheet(wb, staff);
      return wb.xlsx.writeBuffer().then(function (buf) {
        var blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        var suffix = state.exportRange === "all" ? "all-dates" : (starts.length === 1 ? "week-of-" + toISODate(starts[0]) : starts.length + "-weeks-from-" + toISODate(starts[0]));
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "roster-ledger-" + suffix + ".xlsx";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      });
    }).catch(function () {
      state.exportError = "Couldn't build the Excel file. Check your internet connection and try again.";
    }).then(function () {
      state.exporting = false;
      render();
    });
  }

  // Switching between the staff link and the admin link without reloading.
  window.addEventListener("hashchange", function () {
    var next = isAdminUrl() ? "owner" : "staff";
    if (next === state.tab) return;
    if (state.tab === "owner") lockAdmin("");
    state.tab = next;
    state.formError = "";
    render();
    if (next === "owner") ensureOwnerFlow(); else { unsubStaffEditor(); ensureStaffFlow(); }
  });

  // ---------- admin auto-lock ----------
  var IDLE_LIMIT_MS = 15000;   // lock after 15 seconds with no activity
  var WARN_AT_MS = 5000;       // show a countdown for the last 5 seconds
  var lastActivity = Date.now();
  var idleTimer = null;

  function markActivity() { if (state.ownerUnlocked) lastActivity = Date.now(); }
  ["mousemove", "mousedown", "keydown", "touchstart", "wheel", "scroll", "input"].forEach(function (evt) {
    window.addEventListener(evt, markActivity, { passive: true, capture: true });
  });
  // Coming back to the page after it was hidden counts as idle time, not activity.
  document.addEventListener("visibilitychange", checkIdle);

  function startIdleWatch() {
    lastActivity = Date.now();
    if (!idleTimer) idleTimer = setInterval(checkIdle, 500);
  }
  function stopIdleWatch() {
    if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
    showLockToast("");
  }
  // The file picker blocks the page, so pause the countdown while it's open
  // (up to 2 minutes) and restart it when the picker closes.
  var pickerOpenedAt = 0;
  function pauseIdleForPicker() { pickerOpenedAt = Date.now(); }
  function resumeIdle() { if (pickerOpenedAt) { pickerOpenedAt = 0; lastActivity = Date.now(); } }
  window.addEventListener("focus", function () { setTimeout(resumeIdle, 300); });

  function checkIdle() {
    if (!state.ownerUnlocked) { stopIdleWatch(); return; }
    if (pickerOpenedAt) {
      if (Date.now() - pickerOpenedAt < 120000) { lastActivity = Date.now(); showLockToast(""); return; }
      pickerOpenedAt = 0;
    }
    var left = IDLE_LIMIT_MS - (Date.now() - lastActivity);
    if (left <= 0) { lockAdmin("Locked after 15 seconds of no activity. Enter your PIN to continue."); return; }
    showLockToast(left <= WARN_AT_MS ? "Locking in " + Math.ceil(left / 1000) + "s — move the mouse or tap to stay in" : "");
  }
  function showLockToast(msg) {
    var t = document.getElementById("lockToast");
    if (!t) return;
    t.textContent = msg;
    t.hidden = !msg;
  }
  function lockAdmin(msg) {
    stopIdleWatch();
    unsubOwnerDashboard();
    safeDel("roster_owner_unlocked");
    state.ownerUnlocked = false;
    // Clear everyone's data from memory so nothing is left on screen or in the page.
    state.staffDocs = [];
    state.availByCode = {};
    clearStaffActions();
    state.adminMsg = "";
    state.exportError = "";
    state.importData = null;
    state.importError = "";
    state.importMsg = "";
    if (state.tab !== "owner") return;
    state.ownerScreen = "pin";
    state.formError = msg || "";
    render();
  }

  // ---------- staff logic ----------
  function ensureStaffFlow() {
    if (!state.dbReady) return;
    if (state.staffCode && state.staffName) {
      state.staffScreen = "editor";
      subscribeStaffEditor();
      render();
      // If the admin has since removed this code, sign the device out.
      state.db.collection("staff").doc(state.staffCode).get().then(function (snap) {
        if (!snap.exists) {
          safeDel("roster_staff_code"); safeDel("roster_staff_name");
          unsubStaffEditor();
          state.staffCode = null; state.staffName = null; state.staffScreen = "enter-code";
          state.formError = "Your code is no longer active. Ask your manager for your current code.";
          if (state.tab === "staff") render();
        }
      }).catch(function () {});
      return;
    }
    state.staffScreen = "enter-code";
    render();
  }

  function onSubmitCode(ev) {
    ev.preventDefault();
    var code = document.getElementById("codeInput").value.trim().toUpperCase();
    if (!code) return;
    state.formError = "";
    state.db.collection("staff").doc(code).get().then(function (snap) {
      if (!snap.exists) { state.formError = "That code wasn't found. Check with your manager and try again."; render(); return; }
      var data = snap.data();
      safeSet("roster_staff_code", code);
      safeSet("roster_staff_name", data.name || "");
      state.staffCode = code;
      state.staffName = data.name || "";
      state.staffScreen = "editor";
      subscribeStaffEditor();
      render();
    }).catch(function () {
      state.formError = "Couldn't check that code right now. Please try again.";
      render();
    });
  }

  var staffEditorUnsub = null;
  function subscribeStaffEditor() {
    if (staffEditorUnsub) return;
    staffEditorUnsub = state.db.collection("availability").doc(state.staffCode).onSnapshot(function (snap) {
      var entries = (snap.exists && snap.data().entries) || [];
      // Entries saved before shifts existed are split into one per shift, once.
      var mig = migrateLegacy(entries);
      state.availByCode[state.staffCode] = mig.entries;
      if (mig.changed) saveEntries(mig.entries, function () {});
      if (state.tab === "staff") render();
    }, function () {});
  }
  function unsubStaffEditor() { if (staffEditorUnsub) { staffEditorUnsub(); staffEditorUnsub = null; } }

  function onSubmitEntry(ev) {
    ev.preventDefault();
    var form = ev.target;
    var editingId = form.getAttribute("data-editing");
    var shift = SHIFT_BY_ID[state.staffShift] || SHIFTS[0];
    var picked = form.querySelector('input[name="fStatus"]:checked');
    var status = picked ? picked.value : "";
    var dateEl = document.getElementById("fDate");
    var date = dateEl ? dateEl.value : "";
    var dates = editingId ? (date ? [date] : []) : pickedList();
    var note = document.getElementById("fNote").value.trim().slice(0, 140);
    var start = document.getElementById("fStart").value;
    var end = document.getElementById("fEnd").value;
    // Keep what was typed while we show any errors.
    state.entryDraft = { date: date, status: status, note: note, start: start, end: end };
    state.formError = "";
    state.formMsg = "";
    var fe = {};
    if (!dates.length) fe.date = editingId ? "Choose a date." : "Tap at least one date on the calendar.";
    if (!status) fe.status = "Choose Available, Unavailable or Partial availability.";
    if (status === "partial") {
      if (!note) fe.note = "Add a note saying what you can do (e.g. “Can only work 9am – 1pm”).";
      if (start && end && end <= start) fe.time = "The “To” time must be later than the “From” time.";
      if (!start && end && end <= shift.start) fe.time = "The “To” time must be after the shift starts (" + formatTime(shift.start) + ").";
    }
    state.fieldErrors = fe;
    if (Object.keys(fe).length) {
      state.formError = "Please fill in the highlighted " + (Object.keys(fe).length === 1 ? "field" : "fields") + ".";
      render(); return;
    }
    var entries = migrateLegacy(state.availByCode[state.staffCode] || []).entries;
    var partial = status === "partial";
    var timed = partial && (start || end) && !(start === shift.start && end === (shift.end || ""));
    function makeEntry(id, d) {
      return {
        id: id, date: d, shift: shift.id, status: status,
        allDay: !timed, start: timed ? start : "", end: timed ? end : "",
        note: partial ? note : "",
        updatedAt: Date.now()
      };
    }

    if (editingId) {
      // One entry per date per shift — no duplicates.
      var clash = entries.filter(function (e) { return e.shift === shift.id && e.date === date && e.id !== editingId; })[0];
      if (clash) {
        state.formError = "You already have " + shift.label + " availability for " + formatDateLong(date) + ". Edit that entry (✎) instead.";
        state.fieldErrors = { date: "Already recorded for this shift." };
        render(); return;
      }
      var edited = makeEntry(editingId, date);
      entries = entries.map(function (e) { return e.id === editingId ? edited : e; });
      saveEntries(entries, function () { state.editingId = null; state.formMsg = "Saved " + formatDateLong(date) + "."; });
      return;
    }

    // Adding: one entry for every picked date. Dates that already have an
    // entry for this shift are replaced only if the person ticked "Replace".
    var wanted = {};
    dates.forEach(function (d) { wanted[d] = true; });
    var clashDates = {};
    entries.forEach(function (e) { if (e.shift === shift.id && wanted[e.date]) clashDates[e.date] = true; });
    var nClash = Object.keys(clashDates).length;
    var replace = state.replaceExisting;
    var toAdd = dates.filter(function (d) { return replace || !clashDates[d]; });
    if (!toAdd.length) {
      state.formError = "All the dates you picked already have " + shift.label + " entries. Tick “Replace” to overwrite them, or pick other dates.";
      state.fieldErrors = {};
      render(); return;
    }
    if (replace && nClash) entries = entries.filter(function (e) { return !(e.shift === shift.id && clashDates[e.date]); });
    toAdd.forEach(function (d) { entries.push(makeEntry(uid(), d)); });

    var msg = (replace && nClash ? "Saved " : "Added ") + STATUS_LABEL[status] + " for " + toAdd.length + " " + shift.label + " date" + (toAdd.length === 1 ? "" : "s");
    if (replace && nClash) msg += " (" + nClash + " replaced)";
    else if (nClash) msg += ". Kept your existing entr" + (nClash === 1 ? "y" : "ies") + " for " + nClash + " date" + (nClash === 1 ? "" : "s");
    msg += ".";
    saveEntries(entries, function () {
      state.pickDates = {}; state.replaceExisting = false; state.formMsg = msg;
      state.lastDates = dates.slice(); state.lastShift = shift.id;
    });
  }

  function deleteEntry(id) {
    state.formMsg = "";
    var entries = migrateLegacy(state.availByCode[state.staffCode] || []).entries.filter(function (e) { return e.id !== id; });
    saveEntries(entries, function () {});
  }

  function saveEntries(entries, after) {
    state.db.collection("availability").doc(state.staffCode).set({
      code: state.staffCode, name: state.staffName, entries: entries, updatedAt: Date.now()
    }).then(function () {
      state.availByCode[state.staffCode] = entries;
      state.formError = "";
      state.entryDraft = null; state.fieldErrors = null;
      after();
      render();
    }).catch(function () {
      state.formError = "Couldn't save just now — please try again.";
      render();
    });
  }

  // ---------- owner logic ----------
  var staffCollUnsub = null, availCollUnsub = null;
  function ensureOwnerFlow() {
    if (!state.dbReady) return;
    state.db.doc("config/admin").get().then(function (snap) {
      if (!snap.exists) {
        state.ownerScreen = "setup-pin";
      } else if (state.ownerUnlocked) {
        state.ownerScreen = "dashboard";
        subscribeOwnerDashboard();
      } else {
        state.ownerScreen = "pin";
      }
      render();
    }).catch(function (e) {
      state.ownerScreen = "error";
      state.dbError = (e && (e.message || e.code)) ? ((e.code ? "[" + e.code + "] " : "") + (e.message || "")) : String(e);
      render();
    });
  }

  function normalizeAnswer(s) { return String(s || "").trim().toLowerCase(); }

  function onSubmitSetupPin(ev) {
    ev.preventDefault();
    var p1 = document.getElementById("pin1").value.trim();
    var p2 = document.getElementById("pin2").value.trim();
    var recovery = document.getElementById("recovery1").value.trim();
    state.formError = "";
    if (p1.length < 4) { state.formError = "PIN must be at least 4 characters."; render(); return; }
    if (p1 !== p2) { state.formError = "PINs don't match."; render(); return; }
    if (!recovery) { state.formError = "Please set a recovery answer too, in case you forget your PIN."; render(); return; }
    state.db.doc("config/admin").set({ pin: p1, recovery: normalizeAnswer(recovery), setAt: Date.now() }).then(function () {
      startIdleWatch();
      state.ownerUnlocked = true;
      state.ownerScreen = "dashboard";
      subscribeOwnerDashboard();
      render();
    }).catch(function () {
      state.formError = "Couldn't save the PIN — please try again.";
      render();
    });
  }

  function onSubmitPin(ev) {
    ev.preventDefault();
    var pin = document.getElementById("pinInput").value.trim();
    state.formError = "";
    state.db.doc("config/admin").get().then(function (snap) {
      var real = snap.exists ? snap.data().pin : null;
      if (real && pin === real) {
        startIdleWatch();
        state.ownerUnlocked = true;
        state.ownerScreen = "dashboard";
        subscribeOwnerDashboard();
        render();
      } else {
        state.formError = "That PIN isn't right.";
        render();
      }
    }).catch(function () {
      state.formError = "Couldn't check the PIN right now. Please try again.";
      render();
    });
  }

  function onSubmitForgot(ev) {
    ev.preventDefault();
    var answer = normalizeAnswer(document.getElementById("recoveryInput").value);
    state.formError = "";
    state.db.doc("config/admin").get().then(function (snap) {
      var real = snap.exists ? snap.data().recovery : null;
      if (!real) {
        state.formError = "No recovery answer was ever set for this admin PIN — you'll need to reset it directly in Firestore instead.";
        render();
        return;
      }
      if (answer && answer === real) {
        state.ownerScreen = "reset";
        state.formError = "";
        render();
      } else {
        state.formError = "That doesn't match the recovery answer on file.";
        render();
      }
    }).catch(function () {
      state.formError = "Couldn't check that right now. Please try again.";
      render();
    });
  }

  function onSubmitResetPin(ev) {
    ev.preventDefault();
    var p1 = document.getElementById("rpin1").value.trim();
    var p2 = document.getElementById("rpin2").value.trim();
    var newRecovery = document.getElementById("rrecovery").value.trim();
    state.formError = "";
    if (p1.length < 4) { state.formError = "PIN must be at least 4 characters."; render(); return; }
    if (p1 !== p2) { state.formError = "PINs don't match."; render(); return; }
    var ref = state.db.doc("config/admin");
    (newRecovery ? Promise.resolve(null) : ref.get()).then(function (snap) {
      var recovery = newRecovery
        ? normalizeAnswer(newRecovery)
        : ((snap && snap.exists && snap.data().recovery) || "");
      return ref.set({ pin: p1, recovery: recovery, setAt: Date.now() });
    }).then(finishReset).catch(function () {
      state.formError = "Couldn't save the new PIN — please try again.";
      render();
    });
  }

  function finishReset() {
    startIdleWatch();
    state.ownerUnlocked = true;
    state.ownerScreen = "dashboard";
    subscribeOwnerDashboard();
    render();
  }

  // ---------- Excel / CSV import ----------
  // Reads a workbook in the same layout the app exports:
  //  • week sheets — STAFF column, then one column per day, cells like
  //    "Available\nAll day" or "Unavailable\n9:00 AM – 1:00 PM\nnote"
  //  • an "All entries" sheet (or an old CSV export) — one entry per row
  // Nothing is written until the admin reviews the preview and confirms.
  var MONTH_IDX = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };

  function isoFromParts(y, m, d) {
    var dt = new Date(y, m, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== m || dt.getDate() !== d) return null;
    return y + "-" + pad(m + 1) + "-" + pad(d);
  }
  function cellText(v) {
    if (v == null) return "";
    if (v instanceof Date) return v;
    if (typeof v === "object") {
      if (v.richText) return v.richText.map(function (r) { return r.text; }).join("");
      if ("result" in v) return cellText(v.result);
      if (v.text != null) return cellText(v.text);
      return "";
    }
    return String(v);
  }
  function monthFromName(s) {
    var k = String(s || "").slice(0, 3).toLowerCase();
    return k in MONTH_IDX ? MONTH_IDX[k] : -1;
  }
  function nearestYear(m, d, hint) {
    var best = null, bestDiff = Infinity;
    [hint.getFullYear() - 1, hint.getFullYear(), hint.getFullYear() + 1].forEach(function (y) {
      var iso = isoFromParts(y, m, d);
      if (!iso) return;
      var diff = Math.abs(new Date(y, m, d) - hint);
      if (diff < bestDiff) { bestDiff = diff; best = iso; }
    });
    return best;
  }
  // Returns "YYYY-MM-DD" or null. Day-first for numeric dates (21/09/2026).
  function parseDateValue(v, hint) {
    hint = hint || new Date();
    if (v instanceof Date) return isoFromParts(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate());
    if (typeof v === "number" && v > 20000 && v < 80000) {
      var dt = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
      return isoFromParts(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());
    }
    var s = String(v == null ? "" : v).trim();
    if (!s) return null;
    var m;
    if ((m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))) return isoFromParts(+m[1], +m[2] - 1, +m[3]);
    if ((m = s.match(/\b(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?\b/))) {
      var y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null;
      return y ? isoFromParts(y, +m[2] - 1, +m[1]) : nearestYear(+m[2] - 1, +m[1], hint);
    }
    var re = /(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,9})\.?(?:,?\s+(\d{4}))?/g;
    while ((m = re.exec(s))) {
      var mi = monthFromName(m[2]);
      if (mi >= 0) return m[3] ? isoFromParts(+m[3], mi, +m[1]) : nearestYear(mi, +m[1], hint);
    }
    re = /([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?/g;
    while ((m = re.exec(s))) {
      var mj = monthFromName(m[1]);
      if (mj >= 0) return m[3] ? isoFromParts(+m[3], mj, +m[2]) : nearestYear(mj, +m[2], hint);
    }
    return null;
  }
  function hhmm(h, mi) { return pad(h) + ":" + pad(mi); }
  // One clock time: "9", "9:30", "9am", "2:15 PM", "14:00", Excel time values.
  function parseClock(v) {
    if (v instanceof Date) return hhmm(v.getUTCHours(), v.getUTCMinutes());
    if (typeof v === "number" && v >= 0 && v < 1) { var mins = Math.round(v * 1440); return hhmm(Math.floor(mins / 60) % 24, mins % 60); }
    var m = String(v == null ? "" : v).trim().match(/^(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|a|p)?\.?$/i);
    if (!m) return null;
    var h = +m[1], mi = m[2] ? +m[2] : 0, ap = (m[3] || "").toLowerCase();
    if (mi > 59 || h > 23) return null;
    if (ap) { if (h < 1 || h > 12) return null; if (ap[0] === "p" && h !== 12) h += 12; if (ap[0] === "a" && h === 12) h = 0; }
    return hhmm(h, mi);
  }
  // A time range: "9-5", "9am - 1pm", "9:00 AM – 1:00 PM", "13:00 to 17:30".
  function parseTimeRange(str) {
    var m = String(str || "").trim().match(/^(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|a|p)?\.?\s*(?:-|–|—|to|until|till)\s*(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|a|p)?\.?$/i);
    if (!m) return null;
    function to24(h, ap) { if (!ap) return h; ap = ap[0].toLowerCase(); if (h < 1 || h > 12) return -1; if (ap === "p" && h !== 12) return h + 12; if (ap === "a" && h === 12) return 0; return h; }
    var sh = +m[1], sm = m[2] ? +m[2] : 0, eh = +m[4], em = m[5] ? +m[5] : 0;
    var sap = m[3], eap = m[6];
    if (sm > 59 || em > 59 || sh > 23 || eh > 23) return null;
    eh = to24(eh, eap);
    if (sap) sh = to24(sh, sap);
    else if (eap) { if (sh <= 12 && sh + 12 < eh + (em > 0 ? 1 : 0) && sh + 12 <= 23) sh += 12; }
    else if (sh <= 12 && eh <= 12 && (eh * 60 + em) <= (sh * 60 + sm)) eh += 12; // "9-5" → 09:00–17:00
    if (sh < 0 || eh < 0 || eh > 23) return null;
    if (eh * 60 + em <= sh * 60 + sm) return null;
    return { start: hhmm(sh, sm), end: hhmm(eh, em) };
  }
  var STATUS_LONG = /^(partial(?:ly)?(?:\s+availab(?:le|ility))?|part[\s-]*time|part|not\s+available|unavailable|unavail|available|avail|day\s+off|off)\b\s*[:\-–—,]?\s*(.*)$/i;
  var STATUS_SHORT = /^(yes|no|y|n|a|u|p)\b\s*[:\-–—,]?\s*(.*)$/i;
  function statusFromWord(w) {
    w = w.toLowerCase().replace(/\s+/g, " ");
    if (w === "p" || w.indexOf("part") === 0) return "partial";
    return (w === "available" || w === "avail" || w === "a" || w === "y" || w === "yes") ? "available" : "unavailable";
  }
  // Imported entries follow the same rules as the staff form: times mean
  // Partial, and Partial always has a note. Returns an error message or null.
  function finishImported(e) {
    var timed = !e.allDay && (e.start || e.end);
    if (timed && e.status !== "partial") {
      var n = normalizeStatus(e);
      e.status = n.status; e.note = n.note;
    }
    if (e.status === "partial" && !e.note) {
      if (timed) e.note = "Available " + entryTimeLabel(e).replace(/^From /, "from ").replace(/^Until /, "until ");
      else return "Partial availability needs a note saying what they can do";
    }
    return null;
  }
  function isAllDay(s) { return /^(all[\s-]*day|(whole|full|all|entire)[\s-]*shift)$/i.test(String(s || "").trim()); }
  // "from 5pm", "after 5pm", "5pm onwards", "5pm-close" → start only; "until 1pm" → end only.
  function parseOpenRange(str) {
    var s = String(str || "").trim(), m, t;
    if ((m = s.match(/^(?:from|after|starting(?:\s+at)?|start)\s+(.+)$/i)) && (t = parseClock(m[1]))) return { start: t, end: "" };
    if ((m = s.match(/^(.+?)\s*(?:onwards?|on|\+|[-–—]\s*close|(?:to|till|until)\s+close)$/i)) && (t = parseClock(m[1]))) return { start: t, end: "" };
    if ((m = s.match(/^(?:until|till|to|before)\s+(.+)$/i)) && (t = parseClock(m[1]))) return { start: "", end: t };
    return null;
  }
  function parseAnyRange(str) { return parseTimeRange(str) || parseOpenRange(str); }
  // Works out a shift from a sheet name, title or Shift column value.
  function detectShift(text) {
    var s = String(text || "");
    if (/sun[\s-]*down|evening|night|\bpm\s*shift|\blate\b/i.test(s)) return "sundowner";
    if (/\bday\b|\bmorning|\bam\s*shift|\bearly\b/i.test(s)) return "day";
    for (var i = 0; i < SHIFTS.length; i++) {
      if (s.toLowerCase().indexOf(SHIFTS[i].label.toLowerCase()) >= 0 || s.trim().toLowerCase() === SHIFTS[i].id) return SHIFTS[i].id;
    }
    return null;
  }

  // Parses the text of one day cell into entries. Returns {entries, error}.
  function parseDayCell(text) {
    // Split into lines, and split non-note lines further on ";".
    var parts = [];
    String(text).split(/\r?\n/).forEach(function (ln) {
      ln = ln.trim();
      if (/^notes?\s*[:\-–—]/i.test(ln)) parts.push(ln);
      else ln.split(";").forEach(function (x) { x = x.trim(); if (x) parts.push(x); });
    });
    var out = [], cur = null;
    function applyRest(e, rest) {
      if (!rest) return;
      if (isAllDay(rest)) { e.allDay = true; return; }
      var tr = parseAnyRange(rest);
      if (tr && e.allDay && !e._timed) { e.allDay = false; e.start = tr.start; e.end = tr.end; e._timed = true; return; }
      e.note = e.note ? e.note + " " + rest : rest;
    }
    for (var i = 0; i < parts.length; i++) {
      var line = parts[i];
      var nm = line.match(/^notes?\s*[:\-–—]\s*(.*)$/i);
      if (nm) {
        if (!cur) return { entries: [], error: "A note needs Available, Unavailable or Partial before it" };
        var nt = nm[1].trim();
        if (nt) cur.note = cur.note ? cur.note + " " + nt : nt;
        continue;
      }
      var m = line.match(STATUS_LONG), isStatus = !!m;
      if (!m) {
        m = line.match(STATUS_SHORT);
        if (m && (!m[2] || isAllDay(m[2]) || parseAnyRange(m[2]))) isStatus = true;
      }
      if (isStatus) {
        cur = { status: statusFromWord(m[1]), allDay: true, start: "", end: "", note: "" };
        out.push(cur);
        applyRest(cur, m[2].trim());
      } else if (cur) {
        applyRest(cur, line);
      } else {
        var tr = parseAnyRange(line);
        if (tr) { cur = { status: "available", allDay: false, start: tr.start, end: tr.end, note: "", _timed: true }; out.push(cur); }
        else if (isAllDay(line)) { cur = { status: "available", allDay: true, start: "", end: "", note: "" }; out.push(cur); }
        else return { entries: [], error: "Couldn't tell if this means Available, Unavailable or Partial" };
      }
    }
    out.forEach(function (e) { delete e._timed; e.note = e.note.slice(0, 140); });
    return { entries: out, error: null };
  }

  function dateHintFrom(texts) {
    for (var i = 0; i < texts.length; i++) {
      var m = String(texts[i]).match(/(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})/);
      if (m && monthFromName(m[2]) >= 0) return new Date(+m[3], monthFromName(m[2]), +m[1]);
    }
    return null;
  }
  function rowTexts(ws, r) {
    var out = [];
    if (r < 1) return out;
    ws.getRow(r).eachCell(function (c) { var t = cellText(c.value); if (typeof t === "string") out.push(t); });
    return out;
  }

  // Reads a grid sheet: any number of blocks, each starting with a header row
  // whose column A says STAFF and whose other columns are dates. The shift
  // comes from the sheet name or title (e.g. "Day Shift", "Sundowner Shift").
  function parseWeekSheet(ws, result) {
    var titleTexts = [ws.name].concat(rowTexts(ws, 1), rowTexts(ws, 2));
    var sheetShift = detectShift(ws.name) || detectShift(rowTexts(ws, 1).join(" ")) || null;
    var sheetHintDate = dateHintFrom(titleTexts) || new Date();
    var found = false, dateCols = null;
    for (var r = 1; r <= ws.rowCount; r++) {
      var row = ws.getRow(r);
      var first = cellText(row.getCell(1).value);
      first = typeof first === "string" ? first.trim() : "";
      if (/^(staff|name|employee)\b/i.test(first)) {
        var hint = dateHintFrom(rowTexts(ws, r - 1).concat(rowTexts(ws, r - 2))) || sheetHintDate;
        var cols = [];
        for (var c = 2; c <= Math.max(8, ws.columnCount); c++) {
          var iso = parseDateValue(cellText(row.getCell(c).value), hint);
          if (iso) cols.push({ col: c, date: iso });
        }
        if (cols.length) { dateCols = cols; found = true; continue; }
      }
      if (!dateCols) continue;
      if (/^legend$/i.test(first)) { dateCols = null; continue; }
      if (!first || /^[–—-]/.test(first) || /^week\b/i.test(first) || /^no staff/i.test(first)) continue;
      var name = first;
      dateCols.forEach(function (dc) {
        result.cover(name, "", dc.date, sheetShift);
        var cell = row.getCell(dc.col);
        var txt = cellText(cell.value);
        if (txt instanceof Date) txt = "";
        txt = String(txt).trim();
        if (!txt || /^[–—-]+$/.test(txt)) return;
        var parsed = parseDayCell(txt);
        if (parsed.error) { result.problems.push({ where: ws.name + " " + cell.address, text: txt, why: parsed.error }); return; }
        parsed.entries.forEach(function (e) {
          var err = finishImported(e);
          if (err) { result.problems.push({ where: ws.name + " " + cell.address, text: txt, why: err }); return; }
          e.date = dc.date; e.shift = sheetShift; result.add(name, "", e);
        });
      });
    }
    if (found) { result.weekSheets++; if (!sheetShift) result.noShift = true; }
    return found;
  }

  function headerKey(h) {
    h = String(h || "").trim().toLowerCase().replace(/[^a-z ]/g, "").replace(/\s+/g, " ");
    if (/^(staff name|staff|name|employee|employee name)$/.test(h)) return "name";
    if (/^(code|access code|staff code)$/.test(h)) return "code";
    if (/^(shift|shift name)$/.test(h)) return "shift";
    if (/^(date|day)$/.test(h)) return "date";
    if (/^(all day|allday|all|whole shift|full shift)$/.test(h)) return "allDay";
    if (/^(start|from|start time)$/.test(h)) return "start";
    if (/^(end|to|end time|finish)$/.test(h)) return "end";
    if (/^(status|availability|available)$/.test(h)) return "status";
    if (/^(note|notes|comment|comments)$/.test(h)) return "note";
    return null;
  }
  // rows: array of arrays of raw values; row 0 must be the header.
  function parseListRows(rows, label, result) {
    if (!rows.length) return false;
    var map = {};
    rows[0].forEach(function (h, i) { var k = headerKey(cellText(h)); if (k && !(k in map)) map[k] = i; });
    if (!("name" in map || "code" in map) || !("date" in map) || !("status" in map)) return false;
    result.listSheets++;
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      var get = function (k) { return k in map ? row[map[k]] : null; };
      var name = String(cellText(get("name")) || "").trim();
      var code = String(cellText(get("code")) || "").trim().toUpperCase();
      var rawDate = cellText(get("date"));
      var rawStatus = String(cellText(get("status")) || "").trim();
      if (!name && !code && !rawDate && !rawStatus) continue;
      var where = label + " row " + (r + 1);
      var date = parseDateValue(rawDate);
      if (!date) { result.problems.push({ where: where, text: String(rawDate || "(blank)"), why: "Date not recognised" }); continue; }
      var sm = rawStatus.match(STATUS_LONG) || rawStatus.match(STATUS_SHORT);
      if (!sm) { result.problems.push({ where: where, text: rawStatus || "(blank)", why: "Status should be Available, Unavailable or Partial" }); continue; }
      var rawShift = String(cellText(get("shift")) || "").trim();
      var shift = rawShift ? detectShift(rawShift) : null;
      if (rawShift && !shift) { result.problems.push({ where: where, text: rawShift, why: "Shift should be Day or Sundowner" }); continue; }
      if (!shift) result.noShift = true;
      var s = cellText(get("start")), e = cellText(get("end"));
      var ad = String(cellText(get("allDay")) || "").trim().toLowerCase();
      var start = (s === "" || s == null) ? null : parseClock(s);
      var end = (e === "" || e == null) ? null : parseClock(e);
      var badTime = (s !== "" && s != null && !start) || (e !== "" && e != null && !end);
      var allDay = /^(y|yes|true|1)$/.test(ad) || (!start && !end && !badTime);
      if (!allDay && (badTime || (!start && !end) || (start && end && end <= start))) {
        result.problems.push({ where: where, text: String(s || "") + " – " + String(e || ""), why: "Start/end time not recognised" }); continue;
      }
      var ne = {
        date: date, shift: shift, status: statusFromWord(sm[1]), allDay: allDay,
        start: allDay ? "" : (start || ""), end: allDay ? "" : (end || ""),
        note: String(cellText(get("note")) || "").trim().slice(0, 140)
      };
      var ferr = finishImported(ne);
      if (ferr) { result.problems.push({ where: where, text: rawStatus, why: ferr }); continue; }
      result.cover(name, code, date, shift);
      result.add(name, code, ne);
    }
    return true;
  }

  function newParseResult() {
    var res = { people: {}, order: [], problems: [], weekSheets: 0, listSheets: 0, entryCount: 0, noShift: false };
    function person(name, code) {
      var key = code ? "code:" + code : "name:" + name.toLowerCase().replace(/\s+/g, " ");
      if (!res.people[key]) { res.people[key] = { key: key, name: name, code: code, entries: [], cover: [] }; res.order.push(key); }
      if (name && !res.people[key].name) res.people[key].name = name;
      return res.people[key];
    }
    res.cover = function (name, code, date, shift) { person(name, code).cover.push({ date: date, shift: shift || null }); };
    res.add = function (name, code, e) { person(name, code).entries.push(e); res.entryCount++; };
    return res;
  }

  function parseCsv(text) {
    var rows = [], row = [], field = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(field); field = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += ch;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function readImportFile(file) {
    state.importError = ""; state.importData = null; state.importMsg = "";
    state.importMode = "add"; state.importCreateNew = true; state.importDefaultShift = SHIFTS[0].id;
    var isCsv = /\.csv$/i.test(file.name);
    if (!isCsv && !/\.xlsx$/i.test(file.name)) {
      state.importError = "Please choose an .xlsx file. If it's an older .xls file, open it in Excel and use File → Save As → Excel Workbook (.xlsx).";
      render(); return;
    }
    state.importBusy = true; render();
    var reader = new FileReader();
    reader.onerror = function () { state.importBusy = false; state.importError = "Couldn't read that file."; render(); };
    reader.onload = function () {
      var p;
      if (isCsv) {
        p = Promise.resolve().then(function () {
          var list = newParseResult();
          var ok = parseListRows(parseCsv(String(reader.result).replace(/^﻿/, "")), file.name, list);
          if (!ok) throw new Error("csv-headers");
          return { fileName: file.name, grid: newParseResult(), list: list };
        });
      } else {
        p = loadExcelJS().then(function (ExcelJS) {
          var wb = new ExcelJS.Workbook();
          return wb.xlsx.load(reader.result).then(function () {
            var grid = newParseResult(), list = newParseResult();
            wb.worksheets.forEach(function (ws) {
              if (parseWeekSheet(ws, grid)) return;
              var rows = [];
              for (var r = 1; r <= ws.rowCount; r++) {
                var vals = [], row = ws.getRow(r);
                for (var c = 1; c <= Math.max(ws.columnCount, 1); c++) vals.push(row.getCell(c).value);
                rows.push(vals);
              }
              parseListRows(rows, ws.name, list);
            });
            return { fileName: file.name, grid: grid, list: list };
          });
        });
      }
      p.then(function (data) {
        state.importBusy = false;
        if (!data.grid.weekSheets && !data.list.listSheets) {
          state.importError = "This file isn't in the Roster Ledger layout. It needs shift sheets (a STAFF column followed by one column per day) or an entries sheet with Staff Name, Date and Status columns. Download an Excel file from this page to see the layout.";
        } else {
          state.importData = data;
          state.importSource = data.grid.weekSheets ? "grid" : "list";
        }
        render();
      }).catch(function (err) {
        state.importBusy = false;
        state.importError = err && err.message === "csv-headers"
          ? "That CSV doesn't have Staff Name, Date and Status columns."
          : "Couldn't open that file. Make sure it's an Excel .xlsx file and try again.";
        render();
      });
    };
    if (isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
  }

  function entryKey(e) { return [e.date, e.shift || "", e.allDay ? "all" : (e.start || "") + "-" + (e.end || ""), e.status].join("|"); }
  function resolveShifts(shift) {
    if (shift && SHIFT_BY_ID[shift]) return [shift];
    return state.importDefaultShift === "both" ? SHIFTS.map(function (x) { return x.id; }) : [state.importDefaultShift || SHIFTS[0].id];
  }

  // Works out exactly what an import would change, without writing anything.
  function buildImportPlan() {
    var d = state.importData;
    if (!d) return null;
    var src = state.importSource === "list" ? d.list : d.grid;
    var byCode = {}, byName = {};
    state.staffDocs.forEach(function (s) {
      byCode[s.code] = s;
      var n = (s.name || "").toLowerCase().replace(/\s+/g, " ").trim();
      if (n && !byName[n]) byName[n] = s;
    });
    var plan = { people: [], added: 0, removed: 0, dupes: 0, newStaff: 0, skippedPeople: 0, problems: src.problems, source: src };
    src.order.forEach(function (key) {
      var p = src.people[key];
      var staff = (p.code && byCode[p.code]) || byName[(p.name || "").toLowerCase().replace(/\s+/g, " ").trim()] || null;
      var isNew = !staff;
      if (isNew && !state.importCreateNew) { if (p.entries.length) plan.skippedPeople++; return; }
      if (isNew && !p.name) { plan.skippedPeople++; return; }
      // Old entries without a shift are split per shift first, so nothing is lost.
      var existing = staff ? migrateLegacy(state.availByCode[staff.code] || []).entries : [];
      var kept = existing, removed = 0;
      if (state.importMode === "replace") {
        var covered = {};
        p.cover.forEach(function (c) { resolveShifts(c.shift).forEach(function (sid) { covered[c.date + "|" + sid] = true; }); });
        kept = existing.filter(function (e) { return !covered[e.date + "|" + e.shift]; });
        removed = existing.length - kept.length;
      }
      var seen = {};
      kept.forEach(function (e) { seen[entryKey(e)] = true; });
      var toAdd = [], dupes = 0;
      p.entries.forEach(function (e) {
        resolveShifts(e.shift).forEach(function (sid) {
          var sh = SHIFT_BY_ID[sid];
          var whole = e.allDay || (e.start === sh.start && (e.end || "") === (sh.end || ""));
          var n = { id: uid(), date: e.date, shift: sid, allDay: whole, start: whole ? "" : e.start, end: whole ? "" : e.end, status: e.status, note: e.note, updatedAt: Date.now() };
          var k = entryKey(n);
          if (seen[k]) { dupes++; return; }
          seen[k] = true;
          toAdd.push(n);
        });
      });
      if (!toAdd.length && !removed && !isNew) { plan.dupes += dupes; return; }
      plan.people.push({ name: staff ? staff.name : p.name, code: staff ? staff.code : (p.code || ""), isNew: isNew, finalEntries: kept.concat(toAdd), added: toAdd.length, removed: removed, dupes: dupes });
      plan.added += toAdd.length; plan.removed += removed; plan.dupes += dupes;
      if (isNew) plan.newStaff++;
    });
    return plan;
  }

  function countNewNames() {
    var saved = state.importCreateNew; state.importCreateNew = true;
    var plan = buildImportPlan(); state.importCreateNew = saved;
    return plan ? plan.newStaff : 0;
  }

  function runImport() {
    var plan = buildImportPlan();
    if (!plan || !plan.people.length) return;
    state.importBusy = true; render();
    var chain = Promise.resolve();
    plan.people.forEach(function (p) {
      chain = chain.then(function () {
        var codeP = p.isNew
          ? (p.code
              ? state.db.collection("staff").doc(p.code).get().then(function (snap) { return snap.exists ? findFreeCode(0) : p.code; })
              : findFreeCode(0)).then(function (code) {
                p.code = code;
                return state.db.collection("staff").doc(code).set({ name: p.name, code: code, createdAt: Date.now() }).then(function () { return code; });
              })
          : Promise.resolve(p.code);
        return codeP.then(function (code) {
          return state.db.collection("availability").doc(code).set({ code: code, name: p.name, entries: p.finalEntries, updatedAt: Date.now() });
        });
      });
    });
    chain.then(function () {
      var newOnes = plan.people.filter(function (p) { return p.isNew; });
      state.importMsg = "Imported " + plan.added + " " + (plan.added === 1 ? "entry" : "entries") +
        (plan.removed ? ", replaced " + plan.removed : "") +
        (newOnes.length ? ". New staff and their codes: " + newOnes.map(function (p) { return p.name + " (" + p.code + ")"; }).join(", ") : "") + ".";
      state.importData = null;
    }).catch(function () {
      state.importError = "The import stopped part-way because the database couldn't be reached. Anything shown in the grid was saved — you can safely run the same file again; entries already added will be skipped.";
    }).then(function () { state.importBusy = false; render(); });
  }

      (state.importMsg ? '<div class="banner" style="margin-top:10px;">' + escapeHtml(state.importMsg) + '</div>' : '') +
      (state.importError ? '<div class="banner error" style="margin-top:10px;">' + escapeHtml(state.importError) + '</div>' : '');
    if (!d) {
      html += '<div class="row" style="margin-top:14px; align-items:center;">' +

        '</label>' +
        '<span class="muted" style="font-size:0.8rem;">Tip: download an Excel file above to use as a blank template.</span>' +
      '</div>';
      return html + '</div>';
    }
    var plan = buildImportPlan();
    var newNames = countNewNames();
    var both = d.grid.weekSheets && d.list.listSheets;
    html += '<div class="import-file">📄 ' + escapeHtml(d.fileName) + '</div>' +
      '<div class="import-opts">' +
        (both ? '<div class="field"><label for="impSource">Read from</label><select id="impSource">' +
          '<option value="grid"' + (state.importSource === "grid" ? " selected" : "") + '>Shift sheets (' + d.grid.weekSheets + ')</option>' +
          '<option value="list"' + (state.importSource === "list" ? " selected" : "") + '>All entries sheet</option>' +
        '</select></div>' : '') +
        ((state.importSource === "list" ? d.list : d.grid).noShift ? '<div class="field"><label for="impShift">Sheets or rows without a shift name count as</label><select id="impShift">' +
          SHIFTS.map(function (sh) { return '<option value="' + sh.id + '"' + (state.importDefaultShift === sh.id ? " selected" : "") + '>' + escapeHtml(sh.label + " (" + sh.hours + ")") + '</option>'; }).join("") +
          '<option value="both"' + (state.importDefaultShift === "both" ? " selected" : "") + '>Both shifts</option>' +
        '</select></div>' : '') +
        '<div class="field"><label>If someone already has entries on those dates and shifts</label>' +
          '<label class="checkline"><input type="radio" name="impMode" value="add"' + (state.importMode !== "replace" ? " checked" : "") + '> Keep them and add the file\'s entries (exact duplicates are skipped)</label>' +
          '<label class="checkline"><input type="radio" name="impMode" value="replace"' + (state.importMode === "replace" ? " checked" : "") + '> Replace them with what\'s in the file</label>' +
        '</div>' +
        (newNames ? '<label class="checkline"><input type="checkbox" id="impCreateNew"' + (state.importCreateNew ? " checked" : "") + '> Add ' + newNames + ' new ' + (newNames === 1 ? "name" : "names") + ' from the file as staff (each gets a random code)</label>' : '') +
      '</div>';
    html += '<div class="stat-row" style="margin-top:14px;">' +
      '<div class="stat"><div class="num">' + plan.added + '</div><div class="lbl">Entries to add</div></div>' +
      (state.importMode === "replace" ? '<div class="stat"><div class="num">' + plan.removed + '</div><div class="lbl">Entries replaced</div></div>' : '') +
      '<div class="stat"><div class="num">' + plan.dupes + '</div><div class="lbl">Already there (skipped)</div></div>' +
      '<div class="stat"><div class="num">' + plan.problems.length + '</div><div class="lbl">Cells not understood</div></div>' +
    '</div>';
    if (plan.people.length) {
      html += '<div class="staff-roster" style="margin-top:12px;">' + plan.people.map(function (p) {
        return '<div class="srow"><span>' + escapeHtml(p.name) + (p.isNew ? ' <span class="pill pill-available" style="margin-left:4px;">New</span>' : ' <span class="scode">' + escapeHtml(p.code) + '</span>') + '</span>' +
          '<span class="muted">+' + p.added + (p.removed ? ' / −' + p.removed : '') + '</span></div>';
      }).join("") + '</div>';
    }
    if (plan.skippedPeople) html += '<p class="muted" style="margin-top:10px;">' + plan.skippedPeople + ' ' + (plan.skippedPeople === 1 ? "name doesn't" : "names don't") + ' match anyone in your staff list, so ' + (plan.skippedPeople === 1 ? "it" : "they") + ' will be skipped.</p>';
    if (plan.problems.length) {
      html += '<div class="import-problems"><strong>These cells will be skipped:</strong><ul>' +
        plan.problems.slice(0, 12).map(function (pr) {
          return '<li><span class="scode">' + escapeHtml(pr.where) + '</span> “' + escapeHtml(String(pr.text).replace(/\s*\n\s*/g, " / ").slice(0, 60)) + '” — ' + escapeHtml(pr.why) + '</li>';
        }).join("") +
        (plan.problems.length > 12 ? '<li>…and ' + (plan.problems.length - 12) + ' more</li>' : '') +
        '</ul><span class="muted" style="font-size:0.8rem;">Each entry should start with Available, Unavailable or Partial. Partial needs a note or a time (e.g. “Partial - can do 9am-1pm”). Anything after the status is saved as the note.</span></div>';
    }
    html += '<div class="row" style="margin-top:14px;">' +
      '<button class="btn btn-primary" id="btnRunImport"' + (!plan.people.length || state.importBusy ? " disabled" : "") + '>' +
        (state.importBusy ? "Importing…" : (plan.people.length ? "Import " + plan.added + " " + (plan.added === 1 ? "entry" : "entries") + (plan.removed ? " (replace " + plan.removed + ")" : "") : "Nothing new to import")) + '</button>' +
      '<button class="btn btn-ghost" id="btnCancelImport"' + (state.importBusy ? " disabled" : "") + '>Cancel</button>' +

    return html + '</div>';
