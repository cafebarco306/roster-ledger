<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roster Ledger</title>
<style>
  html, body { height: 100%; }
  :root {
    --bg: #EEF0EC;
    --surface: #FFFFFF;
    --surface-2: #F5F6F2;
    --ink: #16211F;
    --ink-dim: #55645F;
    --ink-faint: #8B968F;
    --line: #D7DCD4;
    --accent: #2F6F5E;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2EEE9;
    --available: #B4791E;
    --available-soft: #F6E9D2;
    --unavailable: #A6432F;
    --unavailable-soft: #F5DFD8;
    --shadow: 0 1px 2px rgba(22, 33, 31, 0.06), 0 4px 16px rgba(22, 33, 31, 0.06);
    --radius: 14px;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10171A;
      --surface: #17211F;
      --surface-2: #1D2926;
      --ink: #EAEFEA;
      --ink-dim: #9CAAA4;
      --ink-faint: #5F6E68;
      --line: #2A3532;
      --accent: #57A98F;
      --accent-ink: #0B1211;
      --accent-soft: #1C3630;
      --available: #E0A64C;
      --available-soft: #3A2F17;
      --unavailable: #E1795F;
      --unavailable-soft: #3B211B;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10171A;
    --surface: #17211F;
    --surface-2: #1D2926;
    --ink: #EAEFEA;
    --ink-dim: #9CAAA4;
    --ink-faint: #5F6E68;
    --line: #2A3532;
    --accent: #57A98F;
    --accent-ink: #0B1211;
    --accent-soft: #1C3630;
    --available: #E0A64C;
    --available-soft: #3A2F17;
    --unavailable: #E1795F;
    --unavailable-soft: #3B211B;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding-inline: 16px;
    padding-block: 20px 40px;
    min-height: 100%;
  }
  a { color: inherit; }
  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  header.top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand .mark { font-family: var(--display); font-size: 1.7rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  .brand .tag { font-size: 0.82rem; color: var(--ink-dim); }

  .segmented {
    display: inline-flex; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px; gap: 2px; flex-shrink: 0;
  }
  .segmented button {
    border: none; background: transparent; color: var(--ink-dim); font-family: var(--sans);
    font-size: 0.85rem; font-weight: 600; padding: 7px 16px; border-radius: 999px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .segmented button.active { background: var(--accent); color: var(--accent-ink); }
  .segmented button:not(.active):hover { color: var(--ink); }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
  }
  .card h2 { font-family: var(--display); font-size: 1.2rem; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
  .muted { color: var(--ink-dim); font-size: 0.88rem; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.76rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-dim); }
  input[type=text], input[type=date], input[type=time], select, textarea {
    font-family: var(--sans); font-size: 0.95rem; padding: 9px 11px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); width: 100%;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  textarea { resize: vertical; min-height: 44px; font-family: var(--sans); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 140px; min-width: 0; }

  .btn {
    font-family: var(--sans); font-weight: 600; font-size: 0.9rem; padding: 10px 18px;
    border-radius: 9px; border: 1px solid transparent; cursor: pointer; transition: opacity 0.15s, background 0.15s;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { opacity: 0.92; }
  .btn-ghost { background: transparent; color: var(--ink-dim); border-color: var(--line); }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink-faint); }
  .btn-danger { background: transparent; color: var(--unavailable); border-color: var(--unavailable); }
  .btn-danger:hover { background: var(--unavailable-soft); }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
  .link-btn { background: none; border: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-family: var(--sans); font-size: 0.85rem; text-decoration: underline; text-underline-offset: 2px; }

  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .choice-grid { grid-template-columns: 1fr; } }
  .choice {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; text-align: left;
    background: var(--surface-2); cursor: pointer; display: flex; flex-direction: column; gap: 6px;
  }
  .choice:hover { border-color: var(--accent); }
  .choice .icon { font-size: 1.4rem; }
  .choice h3 { margin: 0; font-family: var(--display); font-size: 1.05rem; }
  .choice p { margin: 0; color: var(--ink-dim); font-size: 0.85rem; }

  .code-display {
    font-family: var(--mono); font-size: 1.5rem; letter-spacing: 0.15em; font-weight: 600;
    background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 12px 16px;
    text-align: center; font-variant-numeric: tabular-nums;
  }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
  .pill-available { background: var(--available-soft); color: var(--available); }
  .pill-unavailable { background: var(--unavailable-soft); color: var(--unavailable); }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .entry-list { display: flex; flex-direction: column; gap: 8px; }
  .entry-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--surface-2); flex-wrap: wrap;
  }
  .entry-date { font-family: var(--mono); font-size: 0.86rem; min-width: 84px; font-variant-numeric: tabular-nums; }
  .entry-time { font-family: var(--mono); font-size: 0.82rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .entry-note { font-size: 0.84rem; color: var(--ink-dim); flex-basis: 100%; }
  .entry-actions { margin-left: auto; display: flex; gap: 6px; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim); border-radius: 7px;
    width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-faint); }

  .empty { color: var(--ink-faint); font-size: 0.88rem; padding: 18px 0; text-align: center; }

  .week-nav { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .week-nav .label { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
  .grid-wrap { overflow-x: auto; }
  table.roster { border-collapse: collapse; width: 100%; min-width: 620px; }
  table.roster th, table.roster td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  table.roster th { background: var(--surface-2); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-dim); font-weight: 700; }
  table.roster th.dayhead { text-align: center; }
  table.roster th.daynum { font-family: var(--mono); font-size: 0.95rem; color: var(--ink); text-transform: none; font-variant-numeric: tabular-nums; }
  table.roster td.name-cell { font-weight: 600; white-space: nowrap; background: var(--surface-2); }
  table.roster td.cell { min-width: 92px; }
  .cell-entry { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
  .cell-empty { color: var(--ink-faint); font-size: 0.8rem; }

  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .stat { flex: 1 1 120px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .num { font-family: var(--display); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .lbl { font-size: 0.76rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.04em; }

  .legend { display: flex; gap: 16px; font-size: 0.8rem; color: var(--ink-dim); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }

  .banner { font-size: 0.82rem; padding: 9px 13px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); }
  .banner.error { background: var(--unavailable-soft); color: var(--unavailable); }

  .toprow { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

  form { display: flex; flex-direction: column; gap: 14px; }
  .checkline { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; }
  .checkline input { width: auto; }

  .staff-roster { display: flex; flex-direction: column; gap: 6px; }
  .staff-roster .srow { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.86rem; }
  .staff-roster .srow:last-child { border-bottom: none; }
  .srow .scode { font-family: var(--mono); color: var(--ink-faint); font-size: 0.78rem; }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark">Roster Ledger</div>
      <div class="tag">Staff availability, kept in one place</div>
    </div>
    <div class="segmented" id="tabSwitch">
      <button data-tab="staff">Staff</button>
      <button data-tab="owner">Admin</button>
    </div>
  </header>

  <div id="app"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  "use strict";

  var STATUS_LABEL = { available: "Available", unavailable: "Unavailable" };
  var DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

  var state = {
    tab: safeGet("roster_view") || "staff",
    staffCode: safeGet("roster_staff_code"),
    staffName: safeGet("roster_staff_name"),
    ownerUnlocked: safeGet("roster_owner_unlocked") === "1",
    db: null,
    dbReady: false,
    staffDocs: [],       // [{code, name, createdAt}]
    availByCode: {},     // code -> entries[]
    weekStart: startOfWeek(new Date()),
    staffScreen: "loading", // loading | welcome | register | enter-code | editor
    ownerScreen: "loading", // loading | setup-pin | pin | dashboard | error
    dbError: "",
    formError: "",
    editingId: null,
    unsubs: []
  };

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function safeDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function toISODate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function startOfWeek(d) {
    var x = new Date(d);
    var day = x.getDay(); // 0 Sun .. 6 Sat
    var diff = (day === 0 ? -6 : 1 - day); // back to Monday
    x.setDate(x.getDate() + diff);
    x.setHours(0, 0, 0, 0);
    return x;
  }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function formatDateLong(iso) {
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  function formatDayNum(d) { return d.getDate(); }
  function formatTime(hhmm) {
    if (!hhmm) return "";
    var parts = hhmm.split(":");
    var h = parseInt(parts[0], 10), m = parts[1];
    var ap = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + m + " " + ap;
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function genCode() {
    var s = "";
    for (var i = 0; i < 6; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
    return s;
  }
  function uid() { return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // ---------- render root ----------
  function render() {
    document.querySelectorAll("#tabSwitch button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === state.tab);
    });
    var app = document.getElementById("app");
    app.innerHTML = state.tab === "staff" ? renderStaffTab() : renderOwnerTab();
    bindHandlers();
  }

  // ---------- STAFF TAB ----------
  function renderStaffTab() {
    if (!state.dbReady) return cardLoading();
    if (state.staffScreen === "welcome") return renderWelcome();
    if (state.staffScreen === "register") return renderRegister();
    if (state.staffScreen === "enter-code") return renderEnterCode();
    if (state.staffScreen === "editor") return renderEditor();
    return cardLoading();
  }

  function cardLoading() {
    return '<div class="card"><p class="muted">Loading…</p></div>';
  }

  function renderWelcome() {
    return (
      '<div class="card">' +
        '<h2>Welcome</h2>' +
        '<p class="muted">Set your availability once, and update it any time your schedule changes.</p>' +
        '<div class="choice-grid" style="margin-top:14px;">' +
          '<button class="choice" id="btnGoRegister"><span class="icon">🆕</span><h3>I\'m new here</h3><p>Enter your name and get a personal access code.</p></button>' +
          '<button class="choice" id="btnGoCode"><span class="icon">🔑</span><h3>I have a code</h3><p>Use the code you were given to open your calendar.</p></button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderRegister() {
    return (
      '<div class="card">' +
        '<h2>Get your access code</h2>' +
        '<p class="muted">This creates a personal code you\'ll use to come back and edit your availability.</p>' +
        (state.formError ? '<div class="banner error" style="margin-top:10px;">' + escapeHtml(state.formError) + '</div>' : '') +
        '<form id="formRegister" style="margin-top:14px;">' +
          '<div class="field"><label for="regName">Your name</label><input type="text" id="regName" placeholder="e.g. Priya Nair" required maxlength="60"></div>' +
          '<div class="field"><label for="regCode">Choose your own code (optional)</label><input type="text" id="regCode" placeholder="e.g. PRIYA1 — leave blank for a random one" maxlength="16" style="font-family:var(--mono);letter-spacing:0.08em;text-transform:uppercase;"><span class="muted" style="font-size:0.78rem;">4–16 letters or numbers. Pick something you\'ll remember, or we\'ll generate one for you.</span></div>' +
          '<div class="row">' +
            '<button type="submit" class="btn btn-primary">Create my code</button>' +
            '<button type="button" class="btn btn-ghost" id="btnBackWelcome">Back</button>' +
          '</div>' +
        '</form>' +
      '</div>'
    );
  }

  function renderEnterCode() {
    return (
      '<div class="card">' +
        '<h2>Enter your code</h2>' +
        '<p class="muted">The code you chose (or were given) when you first signed up.</p>' +
        (state.formError ? '<div class="banner error" style="margin-top:10px;">' + escapeHtml(state.formError) + '</div>' : '') +
        '<form id="formCode" style="margin-top:14px;">' +
          '<div class="field"><label for="codeInput">Access code</label><input type="text" id="codeInput" placeholder="ABC234" required maxlength="16" style="font-family:var(--mono);letter-spacing:0.15em;text-transform:uppercase;"></div>' +
          '<div class="row">' +
            '<button type="submit" class="btn btn-primary">Open my calendar</button>' +
            '<button type="button" class="btn btn-ghost" id="btnBackWelcome">Back</button>' +
          '</div>' +
        '</form>' +
      '</div>'
    );
  }

  function renderEditor() {
    var entries = (state.availByCode[state.staffCode] || []).slice();
    entries.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var todayISO = toISODate(new Date());
    var showPast = state.showPast;
    var visible = entries.filter(function (e) { return showPast || e.date >= todayISO; });

    var listHtml = visible.length
      ? '<div class="entry-list">' + visible.map(renderEntryRow).join("") + '</div>'
      : '<div class="empty">No availability added yet. Use the form above to add some.</div>';

    return (
      '<div class="card">' +
        '<div class="toprow">' +
          '<div><h2>Hi, ' + escapeHtml(state.staffName || "") + '</h2><p class="muted">Your code is <strong style="font-family:var(--mono);letter-spacing:0.08em;">' + escapeHtml(state.staffCode) + '</strong> — keep it somewhere safe.</p></div>' +
          '<button class="link-btn" id="btnSwitchStaff">Not you? Switch account</button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<h2>' + (state.editingId ? "Edit availability" : "Add availability") + '</h2>' +
        renderEntryForm(state.editingId ? findEntry(entries, state.editingId) : null) +
      '</div>' +

      '<div class="card">' +
        '<div class="toprow">' +
          '<h2 style="margin:0;">Your availability</h2>' +
          '<label class="checkline"><input type="checkbox" id="chkShowPast" ' + (showPast ? "checked" : "") + '> Show past dates</label>' +
        '</div>' +
        '<div style="margin-top:12px;">' + listHtml + '</div>' +
      '</div>'
    );
  }

  function findEntry(entries, id) {
    for (var i = 0; i < entries.length; i++) if (entries[i].id === id) return entries[i];
    return null;
  }

  function renderEntryForm(existing) {
    var e = existing || { date: "", allDay: true, start: "09:00", end: "17:00", status: "available", note: "" };
    return (
      '<form id="formEntry" data-editing="' + (existing ? existing.id : "") + '">' +
        '<div class="row">' +
          '<div class="field"><label for="fDate">Date</label><input type="date" id="fDate" required value="' + escapeHtml(e.date) + '"></div>' +
          '<div class="field"><label for="fStatus">Status</label><select id="fStatus">' +
            '<option value="available" ' + (e.status === "available" ? "selected" : "") + '>Available</option>' +
            '<option value="unavailable" ' + (e.status === "unavailable" ? "selected" : "") + '>Unavailable</option>' +
          '</select></div>' +
        '</div>' +
        '<label class="checkline"><input type="checkbox" id="fAllDay" ' + (e.allDay ? "checked" : "") + '> All day</label>' +
        '<div class="row" id="timeRow" style="' + (e.allDay ? "display:none;" : "") + '">' +
          '<div class="field"><label for="fStart">From</label><input type="time" id="fStart" value="' + escapeHtml(e.start || "09:00") + '"></div>' +
          '<div class="field"><label for="fEnd">To</label><input type="time" id="fEnd" value="' + escapeHtml(e.end || "17:00") + '"></div>' +
        '</div>' +
        '<div class="field"><label for="fNote">Note (optional)</label><textarea id="fNote" maxlength="140" placeholder="e.g. Only after 2pm">' + escapeHtml(e.note || "") + '</textarea></div>' +
        '<div class="row">' +
          '<button type="submit" class="btn btn-primary">' + (existing ? "Save changes" : "Add to calendar") + '</button>' +
          (existing ? '<button type="button" class="btn btn-ghost" id="btnCancelEdit">Cancel</button>' : '') +
        '</div>' +
      '</form>'
    );
  }

  function renderEntryRow(e) {
    var pillClass = e.status === "available" ? "pill-available" : "pill-unavailable";
    var timeStr = e.allDay ? "All day" : (formatTime(e.start) + "–" + formatTime(e.end));
    return (
      '<div class="entry-row">' +
        '<span class="entry-date">' + formatDateLong(e.date) + '</span>' +
        '<span class="pill ' + pillClass + '"><span class="pill-dot"></span>' + STATUS_LABEL[e.status] + '</span>' +
        '<span class="entry-time">' + timeStr + '</span>' +
        '<span class="entry-actions">' +
          '<button class="icon-btn" data-edit="' + e.id + '" title="Edit" aria-label="Edit">✎</button>' +
          '<button class="icon-btn" data-del="' + e.id + '" title="Delete" aria-label="Delete">🗑</button>' +
        '</span>' +
        (e.note ? '<span class="entry-note">' + escapeHtml(e.note) + '</span>' : '') +
      '</div>'
    );
  }

  // ---------- OWNER TAB ----------
  function renderOwnerTab() {
    if (!state.dbReady) return cardLoading();
    if (state.ownerScreen === "setup-pin") return renderSetupPin();
    if (state.ownerScreen === "pin") return renderPinGate();
    if (state.ownerScreen === "forgot") return renderForgotPin();
    if (state.ownerScreen === "reset") return renderResetPin();
    if (state.ownerScreen === "dashboard") return renderDashboard();
    if (state.ownerScreen === "error") return renderOwnerError();
    return cardLoading();
  }

      '<div class="card">' +
        '<h2>Set up admin access</h2>' +
        '<p class="muted">Choose a PIN you\'ll use to open the admin dashboard on this or any device. Anyone with this PIN can see everyone\'s availability, so keep it to yourself and your managers.</p>' +

        '<form id="formSetupPin" style="margin-top:14px;">' +

    return (
      '<div class="card">' +
        '<h2>Forgot your PIN</h2>' +
        '<p class="muted">Answer your recovery question to set a new PIN.</p>' +

    return (
      '<div class="card">' +
        '<h2>Set a new PIN</h2>' +
        '<p class="muted">Recovery answer confirmed. Choose a new PIN below.</p>' +
        (state.formError ? '<div class="banner error" style="margin-top:10px;">' + escapeHtml(state.formError) + '</div>' : '') +
        '<form id="formResetPin" style="margin-top:14px;">' +
          '<div class="row">' +
            '<div class="field"><label for="rpin1">New PIN (4+ digits)</label><input type="text" id="rpin1" inputmode="numeric" maxlength="10" required></div>' +

  function renderDashboard() {
    var days = [];
    for (var i = 0; i < 7; i++) days.push(addDays(state.weekStart, i));
    var weekLabel = days[0].toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " – " +
      days[6].toLocaleDateString(undefined, { month: "short", day: "numeric" });

    var staff = state.staffDocs.slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });

    var totalEntries = 0;
    Object.keys(state.availByCode).forEach(function (c) { totalEntries += (state.availByCode[c] || []).length; });

    var headRow = '<tr><th>Staff</th>' + days.map(function (d) {
      return '<th class="dayhead">' + DAY_NAMES[(d.getDay() + 6) % 7] + '<br><span class="daynum">' + formatDayNum(d) + '</span></th>';
    }).join("") + '</tr>';

    var bodyRows = staff.length ? staff.map(function (s) {
      var entries = state.availByCode[s.code] || [];
      var cells = days.map(function (d) {
        var iso = toISODate(d);
        var dayEntries = entries.filter(function (e) { return e.date === iso; });
        if (!dayEntries.length) return '<td class="cell"><span class="cell-empty">–</span></td>';
        var html = dayEntries.map(function (e) {
          var pillClass = e.status === "available" ? "pill-available" : "pill-unavailable";
          var timeStr = e.allDay ? "All day" : (formatTime(e.start) + "–" + formatTime(e.end));
          var title = e.note ? (STATUS_LABEL[e.status] + (e.allDay ? "" : " " + timeStr) + ": " + e.note) : (STATUS_LABEL[e.status] + (e.allDay ? "" : " " + timeStr));
          return '<div class="cell-entry" title="' + escapeHtml(title) + '"><span class="pill ' + pillClass + '"><span class="pill-dot"></span>' + STATUS_LABEL[e.status] + '</span>' +
            (e.allDay ? '' : '<span class="entry-time">' + timeStr + '</span>') + '</div>';
        }).join("");
        return '<td class="cell">' + html + '</td>';
      }).join("");
      return '<tr><td class="name-cell">' + escapeHtml(s.name) + '</td>' + cells + '</tr>';
    }).join("") : '<tr><td colspan="8" class="empty">No staff have registered yet. Share the app link and have them add themselves under the Staff tab.</td></tr>';

    return (
      '<div class="card">' +
        '<div class="toprow">' +
          '<h2 style="margin:0;">Overview</h2>' +
          '<button class="btn btn-ghost btn-sm" id="btnExportCsv">⬇ Download CSV</button>' +
        '</div>' +
        '<div class="stat-row" style="margin-top:14px;">' +
          '<div class="stat"><div class="num">' + staff.length + '</div><div class="lbl">Staff registered</div></div>' +
          '<div class="stat"><div class="num">' + totalEntries + '</div><div class="lbl">Availability entries logged</div></div>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="week-nav">' +
          '<button class="icon-btn" id="btnPrevWeek" aria-label="Previous week">‹</button>' +
          '<span class="label">' + weekLabel + '</span>' +
          '<button class="icon-btn" id="btnNextWeek" aria-label="Next week">›</button>' +
        '</div>' +
        '<div class="grid-wrap" style="margin-top:14px;">' +
          '<table class="roster"><thead>' + headRow + '</thead><tbody>' + bodyRows + '</tbody></table>' +
        '</div>' +
        '<div class="legend" style="margin-top:12px;">' +
          '<span><span class="swatch" style="background:var(--available);"></span>Available</span>' +
          '<span><span class="swatch" style="background:var(--unavailable);"></span>Unavailable</span>' +
          '<span>Hover a cell for notes</span>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<h2>Staff</h2>' +
        '<div class="staff-roster">' + (staff.length ? staff.map(function (s) {
          var count = (state.availByCode[s.code] || []).length;
          return '<div class="srow"><span>' + escapeHtml(s.name) + ' <span class="scode">' + escapeHtml(s.code) + '</span></span><span class="muted">' + count + ' ' + (count === 1 ? "entry" : "entries") + '</span></div>';
        }).join("") : '<p class="muted">No staff yet.</p>') + '</div>' +
      '</div>' +

      '<div class="card">' +
        '<button class="link-btn" id="btnLockOwner">Lock admin view</button>' +
      '</div>'
    );
  }

  // ---------- event binding ----------
  function bindHandlers() {
    var el;

    if ((el = document.getElementById("btnGoRegister"))) el.onclick = function () { state.staffScreen = "register"; state.formError = ""; render(); };
    if ((el = document.getElementById("btnGoCode"))) el.onclick = function () { state.staffScreen = "enter-code"; state.formError = ""; render(); };
    if ((el = document.getElementById("btnBackWelcome"))) el.onclick = function () { state.staffScreen = "welcome"; state.formError = ""; render(); };
    if ((el = document.getElementById("btnSwitchStaff"))) el.onclick = function () {
      safeDel("roster_staff_code"); safeDel("roster_staff_name");
      unsubStaffEditor();
      state.staffCode = null; state.staffName = null; state.staffScreen = "welcome";
      render();
    };

    if ((el = document.getElementById("formRegister"))) el.onsubmit = onSubmitRegister;
    if ((el = document.getElementById("formCode"))) el.onsubmit = onSubmitCode;
    if ((el = document.getElementById("formEntry"))) el.onsubmit = onSubmitEntry;
    if ((el = document.getElementById("btnCancelEdit"))) el.onclick = function () { state.editingId = null; render(); };
    if ((el = document.getElementById("fAllDay"))) el.onchange = function () {
      document.getElementById("timeRow").style.display = el.checked ? "none" : "";
    };
    if ((el = document.getElementById("chkShowPast"))) el.onchange = function () { state.showPast = el.checked; render(); };

    document.querySelectorAll("[data-edit]").forEach(function (b) {
      b.onclick = function () { state.editingId = b.getAttribute("data-edit"); render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    });
    document.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () { deleteEntry(b.getAttribute("data-del")); };
    });

    if ((el = document.getElementById("formSetupPin"))) el.onsubmit = onSubmitSetupPin;
    if ((el = document.getElementById("formPin"))) el.onsubmit = onSubmitPin;
    if ((el = document.getElementById("btnForgotPin"))) el.onclick = function () { state.ownerScreen = "forgot"; state.formError = ""; render(); };
    if ((el = document.getElementById("btnRetryOwner"))) el.onclick = function () { state.ownerScreen = "loading"; state.dbError = ""; render(); ensureOwnerFlow(); };
    if ((el = document.getElementById("btnBackToPin"))) el.onclick = function () { state.ownerScreen = "pin"; state.formError = ""; render(); };
    if ((el = document.getElementById("formForgot"))) el.onsubmit = onSubmitForgot;
    if ((el = document.getElementById("formResetPin"))) el.onsubmit = onSubmitResetPin;
    if ((el = document.getElementById("btnLockOwner"))) el.onclick = function () {
      safeDel("roster_owner_unlocked"); state.ownerUnlocked = false; state.ownerScreen = "pin"; unsubOwnerDashboard(); render();
    };
    if ((el = document.getElementById("btnPrevWeek"))) el.onclick = function () { state.weekStart = addDays(state.weekStart, -7); render(); };
    if ((el = document.getElementById("btnNextWeek"))) el.onclick = function () { state.weekStart = addDays(state.weekStart, 7); render(); };
    if ((el = document.getElementById("btnExportCsv"))) el.onclick = exportCsv;
  }

  // ---------- CSV export ----------
  function buildCsvRows() {
    var rows = [["Staff Name", "Code", "Date", "All Day", "Start", "End", "Status", "Note"]];
    var staff = state.staffDocs.slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });
    staff.forEach(function (s) {
      var entries = (state.availByCode[s.code] || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      entries.forEach(function (e) {
        rows.push([s.name, s.code, e.date, e.allDay ? "Y" : "N", e.allDay ? "" : e.start, e.allDay ? "" : e.end, STATUS_LABEL[e.status] || e.status, e.note || ""]);
      });
    });
    return rows;
  }
  function csvEscape(v) {
    var s = String(v == null ? "" : v);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function rowsToCsv(rows) {
    return rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\r\n");
  }
  function exportCsv() {
    var csv = rowsToCsv(buildCsvRows());
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "staff-availability-" + toISODate(new Date()) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  document.getElementById("tabSwitch").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-tab]");
    if (!btn) return;
    state.tab = btn.getAttribute("data-tab");
    safeSet("roster_view", state.tab);
    render();
    if (state.tab === "owner") ensureOwnerFlow();
    if (state.tab === "staff") ensureStaffFlow();
  });

  // ---------- staff logic ----------
  function ensureStaffFlow() {
    if (!state.dbReady) return;
    if (state.staffCode && state.staffName) {
      state.staffScreen = "editor";
      subscribeStaffEditor();
    } else {
      state.staffScreen = "welcome";
    }
    render();
  }

  function onSubmitRegister(ev) {
    ev.preventDefault();
    var name = document.getElementById("regName").value.trim();
    var chosen = document.getElementById("regCode").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!name) return;
    state.formError = "";
    if (chosen) {
      if (chosen.length < 4) { state.formError = "Your code needs to be at least 4 letters or numbers."; render(); return; }
      createStaffWithCode(name, chosen, true);
    } else {
      tryCreateStaff(name, 0);
    }
  }

  function createStaffWithCode(name, code, isChosen) {
    state.db.collection("staff").doc(code).get().then(function (snap) {
      if (snap.exists) {
        state.formError = isChosen
          ? "That code is already taken — try adding a number or a variation."
          : "Could not create a code right now. Please try again.";
        render();
        return;
      }
      return state.db.collection("staff").doc(code).set({ name: name, code: code, createdAt: Date.now() }).then(function () {
        safeSet("roster_staff_code", code);
        safeSet("roster_staff_name", name);
        state.staffCode = code;
        state.staffName = name;
        state.staffScreen = "editor";
        subscribeStaffEditor();
        render();
      });
    }).catch(function () {
      state.formError = "Something went wrong creating your code. Please try again.";
      render();
    });
  }

  function tryCreateStaff(name, attempt) {
    if (attempt > 5) { state.formError = "Could not create a code right now. Please try again."; render(); return; }
    var code = genCode();
    state.db.collection("staff").doc(code).get().then(function (snap) {
      if (snap.exists) return tryCreateStaff(name, attempt + 1);
      return createStaffWithCode(name, code, false);
    }).catch(function () {
      state.formError = "Something went wrong creating your code. Please try again.";
      render();
    });
  }

  function onSubmitCode(ev) {
    ev.preventDefault();
    var code = document.getElementById("codeInput").value.trim().toUpperCase();
    if (!code) return;
    state.formError = "";
    state.db.collection("staff").doc(code).get().then(function (snap) {
      if (!snap.exists) { state.formError = "That code wasn't found. Check with your manager and try again."; render(); return; }
      var data = snap.data();
      safeSet("roster_staff_code", code);
      safeSet("roster_staff_name", data.name || "");
      state.staffCode = code;
      state.staffName = data.name || "";
      state.staffScreen = "editor";
      subscribeStaffEditor();
      render();
    }).catch(function () {
      state.formError = "Couldn't check that code right now. Please try again.";
      render();
    });
  }

  var staffEditorUnsub = null;
  function subscribeStaffEditor() {
    if (staffEditorUnsub) return;
    staffEditorUnsub = state.db.collection("availability").doc(state.staffCode).onSnapshot(function (snap) {
      state.availByCode[state.staffCode] = (snap.exists && snap.data().entries) || [];
      if (state.tab === "staff") render();
    }, function () {});
  }
  function unsubStaffEditor() { if (staffEditorUnsub) { staffEditorUnsub(); staffEditorUnsub = null; } }

  function onSubmitEntry(ev) {
    ev.preventDefault();
    var form = ev.target;
    var editingId = form.getAttribute("data-editing");
    var allDay = document.getElementById("fAllDay").checked;
    var entry = {
      id: editingId || uid(),
      date: document.getElementById("fDate").value,
      allDay: allDay,
      start: allDay ? "" : document.getElementById("fStart").value,
      end: allDay ? "" : document.getElementById("fEnd").value,
      status: document.getElementById("fStatus").value,
      note: document.getElementById("fNote").value.trim().slice(0, 140),
      updatedAt: Date.now()
    };
    if (!entry.date) return;
    var entries = (state.availByCode[state.staffCode] || []).slice();
    if (editingId) {
      entries = entries.map(function (e) { return e.id === editingId ? entry : e; });
    } else {
      entries.push(entry);
    }
    saveEntries(entries, function () { state.editingId = null; });
  }

  function deleteEntry(id) {
    var entries = (state.availByCode[state.staffCode] || []).filter(function (e) { return e.id !== id; });
    saveEntries(entries, function () {});
  }

  function saveEntries(entries, after) {
    state.db.collection("availability").doc(state.staffCode).set({
      code: state.staffCode, name: state.staffName, entries: entries, updatedAt: Date.now()
    }).then(function () {
      state.availByCode[state.staffCode] = entries;
      after();
      render();
    }).catch(function () {
      state.formError = "Couldn't save just now — please try again.";
      render();
    });
  }

  // ---------- owner logic ----------
  var staffCollUnsub = null, availCollUnsub = null;
  function ensureOwnerFlow() {
    if (!state.dbReady) return;
    state.db.doc("config/admin").get().then(function (snap) {
      if (!snap.exists) {
        state.ownerScreen = "setup-pin";
      } else if (state.ownerUnlocked) {
        state.ownerScreen = "dashboard";
        subscribeOwnerDashboard();
      } else {
        state.ownerScreen = "pin";
      }
      render();
    }).catch(function (e) {
      state.ownerScreen = "error";
      state.dbError = (e && (e.message || e.code)) ? ((e.code ? "[" + e.code + "] " : "") + (e.message || "")) : String(e);
      render();
    });
  }

  function normalizeAnswer(s) { return String(s || "").trim().toLowerCase(); }

  function onSubmitSetupPin(ev) {
    ev.preventDefault();
    var p1 = document.getElementById("pin1").value.trim();
    var p2 = document.getElementById("pin2").value.trim();
    var recovery = document.getElementById("recovery1").value.trim();
    state.formError = "";
    if (p1.length < 4) { state.formError = "PIN must be at least 4 characters."; render(); return; }
    if (p1 !== p2) { state.formError = "PINs don't match."; render(); return; }
    if (!recovery) { state.formError = "Please set a recovery answer too, in case you forget your PIN."; render(); return; }
    state.db.doc("config/admin").set({ pin: p1, recovery: normalizeAnswer(recovery), setAt: Date.now() }).then(function () {
      safeSet("roster_owner_unlocked", "1");
      state.ownerUnlocked = true;
      state.ownerScreen = "dashboard";
      subscribeOwnerDashboard();
      render();
    }).catch(function () {
      state.formError = "Couldn't save the PIN — please try again.";
      render();
    });
  }

  function onSubmitPin(ev) {
    ev.preventDefault();
    var pin = document.getElementById("pinInput").value.trim();
    state.formError = "";
    state.db.doc("config/admin").get().then(function (snap) {
      var real = snap.exists ? snap.data().pin : null;
      if (real && pin === real) {
        safeSet("roster_owner_unlocked", "1");
        state.ownerUnlocked = true;
        state.ownerScreen = "dashboard";
        subscribeOwnerDashboard();
        render();
      } else {
        state.formError = "That PIN isn't right.";
        render();
      }
    }).catch(function () {
      state.formError = "Couldn't check the PIN right now. Please try again.";
      render();
    });
  }

  function onSubmitForgot(ev) {
    ev.preventDefault();
    var answer = normalizeAnswer(document.getElementById("recoveryInput").value);
    state.formError = "";
    state.db.doc("config/admin").get().then(function (snap) {
      var real = snap.exists ? snap.data().recovery : null;
      if (!real) {
        state.formError = "No recovery answer was ever set for this admin PIN — you'll need to reset it directly in Firestore instead.";
        render();
        return;
      }
      if (answer && answer === real) {
        state.ownerScreen = "reset";
        state.formError = "";
        render();
      } else {
        state.formError = "That doesn't match the recovery answer on file.";
        render();
      }
    }).catch(function () {
      state.formError = "Couldn't check that right now. Please try again.";
      render();
    });
  }

  function onSubmitResetPin(ev) {
    ev.preventDefault();
    var p1 = document.getElementById("rpin1").value.trim();
    var p2 = document.getElementById("rpin2").value.trim();
    var newRecovery = document.getElementById("rrecovery").value.trim();
    state.formError = "";
    if (p1.length < 4) { state.formError = "PIN must be at least 4 characters."; render(); return; }
    if (p1 !== p2) { state.formError = "PINs don't match."; render(); return; }
    var ref = state.db.doc("config/admin");
    (newRecovery ? Promise.resolve(null) : ref.get()).then(function (snap) {
      var recovery = newRecovery
        ? normalizeAnswer(newRecovery)
        : ((snap && snap.exists && snap.data().recovery) || "");
      return ref.set({ pin: p1, recovery: recovery, setAt: Date.now() });
    }).then(finishReset).catch(function () {
      state.formError = "Couldn't save the new PIN — please try again.";
      render();
    });
  }

  function finishReset() {
    safeSet("roster_owner_unlocked", "1");
    state.ownerUnlocked = true;
    state.ownerScreen = "dashboard";
    subscribeOwnerDashboard();
    render();
  }

  function subscribeOwnerDashboard() {
    if (!staffCollUnsub) {
      staffCollUnsub = state.db.collection("staff").onSnapshot(function (snap) {
        state.staffDocs = snap.docs.map(function (d) { return d.data(); });
        if (state.tab === "owner") render();
      }, function () {});
    }
    if (!availCollUnsub) {
      availCollUnsub = state.db.collection("availability").onSnapshot(function (snap) {
        snap.docs.forEach(function (d) {
          var data = d.data();
          state.availByCode[d.id] = data.entries || [];
        });
        if (state.tab === "owner") render();
      }, function () {});
    }
  }
  function unsubOwnerDashboard() {
    if (staffCollUnsub) { staffCollUnsub(); staffCollUnsub = null; }
    if (availCollUnsub) { availCollUnsub(); availCollUnsub = null; }
  }

  // ---------- Firebase adapter ----------
  // Wraps the Firebase compat SDK so the rest of this file (copied straight
  // from the Claude.ai version) can call .get()/.set()/.onSnapshot() exactly
  // as before, without knowing it's talking to Firestore underneath.
  function makeFirebaseDbAdapter(firestore) {
    function wrapDocSnap(s) {
      return { id: s.id, exists: s.exists(), data: function () { return s.data(); } };
    }
    function wrapQuerySnap(qs) {
      return { docs: qs.docs.map(wrapDocSnap) };
    }
    function wrapDocRef(ref) {
      return {
        id: ref.id,
        get: function () { return ref.get().then(wrapDocSnap); },
        set: function (data) { return ref.set(data); },
        onSnapshot: function (next, err) {
          return ref.onSnapshot(function (s) { next(wrapDocSnap(s)); }, err || function () {});
        },
        collection: function (p) { return wrapCollRef(ref.collection(p)); }
      };
    }
    function wrapCollRef(ref) {
      return {
        doc: function (id) { return wrapDocRef(id ? ref.doc(id) : ref.doc()); },
        add: function (data) { return ref.add(data).then(wrapDocRef); },
        get: function () { return ref.get().then(wrapQuerySnap); },
        onSnapshot: function (next, err) {
          return ref.onSnapshot(function (qs) { next(wrapQuerySnap(qs)); }, err || function () {});
        }
      };
    }
    return {
      doc: function (path) { return wrapDocRef(firestore.doc(path)); },
      collection: function (path) { return wrapCollRef(firestore.collection(path)); }
    };
  }
