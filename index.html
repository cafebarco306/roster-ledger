<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roster Ledger</title>
<style>
  html, body { height: 100%; }
  :root {
    --bg: #EEF0EC;
    --surface: #FFFFFF;
    --surface-2: #F5F6F2;
    --ink: #16211F;
    --ink-dim: #55645F;
    --ink-faint: #8B968F;
    --line: #D7DCD4;
    --accent: #2F6F5E;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2EEE9;
    --available: #B4791E;
    --available-soft: #F6E9D2;
    --unavailable: #A6432F;
    --unavailable-soft: #F5DFD8;
    --partial: #3F6FA0;
    --partial-soft: #DDE7F2;
    --shadow: 0 1px 2px rgba(22, 33, 31, 0.06), 0 4px 16px rgba(22, 33, 31, 0.06);
    --radius: 14px;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10171A;
      --surface: #17211F;
      --surface-2: #1D2926;
      --ink: #EAEFEA;
      --ink-dim: #9CAAA4;
      --ink-faint: #5F6E68;
      --line: #2A3532;
      --accent: #57A98F;
      --accent-ink: #0B1211;
      --accent-soft: #1C3630;
      --available: #E0A64C;
      --available-soft: #3A2F17;
      --unavailable: #E1795F;
      --unavailable-soft: #3B211B;
      --partial: #7FA8D6;
      --partial-soft: #1C2A3A;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10171A;
    --surface: #17211F;
    --surface-2: #1D2926;
    --ink: #EAEFEA;
    --ink-dim: #9CAAA4;
    --ink-faint: #5F6E68;
    --line: #2A3532;
    --accent: #57A98F;
    --accent-ink: #0B1211;
    --accent-soft: #1C3630;
    --available: #E0A64C;
    --available-soft: #3A2F17;
    --unavailable: #E1795F;
    --unavailable-soft: #3B211B;
    --partial: #7FA8D6;
    --partial-soft: #1C2A3A;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding-inline: 16px;
    padding-block: 20px 40px;
    min-height: 100%;
  }
  a { color: inherit; }
  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  header.top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand .mark { font-family: var(--display); font-size: 1.7rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  .brand .tag { font-size: 0.82rem; color: var(--ink-dim); }

  .admin-badge { background: var(--accent); color: var(--accent-ink); font-size: 0.8rem; font-weight: 700; padding: 6px 14px; border-radius: 999px; letter-spacing: 0.03em; }
  .admin-badge[hidden] { display: none; }
  .lock-toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50;
    background: var(--ink); color: var(--bg); font-size: 0.85rem; font-weight: 600;
    padding: 10px 16px; border-radius: 999px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center;
  }
  .lock-toast[hidden] { display: none; }
  .segmented {
    display: inline-flex; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px; gap: 2px; flex-shrink: 0;
  }
  .segmented button {
    border: none; background: transparent; color: var(--ink-dim); font-family: var(--sans);
    font-size: 0.85rem; font-weight: 600; padding: 7px 16px; border-radius: 999px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .segmented button.active { background: var(--accent); color: var(--accent-ink); }
  .segmented button:not(.active):hover { color: var(--ink); }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
  }
  .card h2 { font-family: var(--display); font-size: 1.2rem; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
  .muted { color: var(--ink-dim); font-size: 0.88rem; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.76rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-dim); }
  input[type=text], input[type=date], input[type=time], select, textarea {
    font-family: var(--sans); font-size: 0.95rem; padding: 9px 11px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); width: 100%;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  textarea { resize: vertical; min-height: 44px; font-family: var(--sans); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 140px; min-width: 0; }

  .btn {
    font-family: var(--sans); font-weight: 600; font-size: 0.9rem; padding: 10px 18px;
    border-radius: 9px; border: 1px solid transparent; cursor: pointer; transition: opacity 0.15s, background 0.15s;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { opacity: 0.92; }
  .btn-ghost { background: transparent; color: var(--ink-dim); border-color: var(--line); }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink-faint); }
  .btn-danger { background: transparent; color: var(--unavailable); border-color: var(--unavailable); }
  .btn-danger:hover { background: var(--unavailable-soft); }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
  .link-btn { background: none; border: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-family: var(--sans); font-size: 0.85rem; text-decoration: underline; text-underline-offset: 2px; }

  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .choice-grid { grid-template-columns: 1fr; } }
  .choice {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; text-align: left;
    background: var(--surface-2); cursor: pointer; display: flex; flex-direction: column; gap: 6px;
  }
  .choice:hover { border-color: var(--accent); }
  .choice .icon { font-size: 1.4rem; }
  .choice h3 { margin: 0; font-family: var(--display); font-size: 1.05rem; }
  .choice p { margin: 0; color: var(--ink-dim); font-size: 0.85rem; }

  .code-display {
    font-family: var(--mono); font-size: 1.5rem; letter-spacing: 0.15em; font-weight: 600;
    background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 12px 16px;
    text-align: center; font-variant-numeric: tabular-nums;
  }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
  .pill-available { background: var(--available-soft); color: var(--available); }
  .pill-unavailable { background: var(--unavailable-soft); color: var(--unavailable); }
  .pill-partial { background: var(--partial-soft); color: var(--partial); }
  .cell-note { display: block; font-size: 0.74rem; color: var(--ink-dim); line-height: 1.25; margin-top: 1px; overflow-wrap: anywhere; }
  .status-choice { border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .status-choice legend { font-size: 0.76rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-dim); padding: 0; margin-bottom: 5px; }
  .status-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (max-width: 460px) { .status-opts { grid-template-columns: 1fr; } }
  .status-opt { display: flex; align-items: center; gap: 8px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface-2); cursor: pointer; font-weight: 600; font-size: 0.9rem; }
  .status-opt input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex-shrink: 0; }
  .status-opt .sdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .status-opt.sel-available { border-color: var(--available); background: var(--available-soft); }
  .status-opt.sel-unavailable { border-color: var(--unavailable); background: var(--unavailable-soft); }
  .status-opt.sel-partial { border-color: var(--partial); background: var(--partial-soft); }
  .req { color: var(--unavailable); }
  .invalid input, .invalid textarea, .invalid select, .status-choice.invalid .status-opt { border-color: var(--unavailable) !important; }
  .field-err { color: var(--unavailable); font-size: 0.78rem; font-weight: 600; }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .entry-list { display: flex; flex-direction: column; gap: 8px; }
  .entry-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--surface-2); flex-wrap: wrap;
  }
  .entry-date { font-family: var(--mono); font-size: 0.86rem; min-width: 84px; font-variant-numeric: tabular-nums; }
  .entry-time { font-family: var(--mono); font-size: 0.82rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .entry-note { font-size: 0.84rem; color: var(--ink-dim); flex-basis: 100%; }
  .entry-actions { margin-left: auto; display: flex; gap: 6px; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim); border-radius: 7px;
    width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-faint); }

  .empty { color: var(--ink-faint); font-size: 0.88rem; padding: 18px 0; text-align: center; }

  .week-nav { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .week-nav .label { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
  .grid-wrap { overflow-x: auto; }
  table.roster { border-collapse: collapse; width: 100%; min-width: 620px; }
  table.roster th, table.roster td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  table.roster th { background: var(--surface-2); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-dim); font-weight: 700; }
  table.roster th.dayhead { text-align: center; }
  table.roster th.daynum { font-family: var(--mono); font-size: 0.95rem; color: var(--ink); text-transform: none; font-variant-numeric: tabular-nums; }
  table.roster td.name-cell { font-weight: 600; white-space: nowrap; background: var(--surface-2); }
  table.roster td.cell { min-width: 92px; }
  .cell-entry { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
  .cell-empty { color: var(--ink-faint); font-size: 0.8rem; }

  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .stat { flex: 1 1 120px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .num { font-family: var(--display); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .lbl { font-size: 0.76rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.04em; }

  .legend { display: flex; gap: 16px; font-size: 0.8rem; color: var(--ink-dim); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }

  .banner { font-size: 0.82rem; padding: 9px 13px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); }
  .banner.error { background: var(--unavailable-soft); color: var(--unavailable); }

  .toprow { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

  form { display: flex; flex-direction: column; gap: 14px; }
  .checkline { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; }
  .checkline input { width: auto; }

  .staff-roster { display: flex; flex-direction: column; gap: 6px; }
  .staff-roster .srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.86rem; }
  .staff-roster .srow:last-child { border-bottom: none; }
  .file-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; flex: 0 0 auto; }
  .file-btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .file-btn[aria-disabled="true"] { opacity: 0.6; }
  .import-file { margin-top: 14px; font-family: var(--mono); font-size: 0.85rem; color: var(--ink-dim); word-break: break-all; }
  .import-opts { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .import-opts .checkline { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink); font-size: 0.88rem; }
  .import-opts select { width: auto; }
  .import-problems { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--unavailable-soft); color: var(--ink); font-size: 0.84rem; }
  .import-problems ul { margin: 6px 0 8px; padding-left: 18px; }
  .import-problems li { margin: 3px 0; }
  .dup-box { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--available-soft); border: 1px solid var(--available); font-size: 0.86rem; }
  .dup-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
  .merge-select { width: auto; max-width: 220px; padding: 6px 10px; font-size: 0.82rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .shift-tag { display: block; font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; color: var(--ink-faint); margin-bottom: 1px; }
  .grid-shift { flex-wrap: wrap; border-radius: 12px; }
  .grid-shift button { padding: 6px 12px; font-size: 0.8rem; }
  .shift-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px; }
  .shift-tab { border: none; background: transparent; border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink-dim); font-family: var(--sans); }
  .shift-tab .st-name { font-weight: 700; font-size: 0.95rem; }
  .shift-tab .st-hours { font-size: 0.76rem; }
  .shift-tab.active { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
  .shift-tab:not(.active):hover { color: var(--ink); background: var(--surface); }
  .srow-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .export-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .export-bar select { width: auto; padding: 6px 10px; font-size: 0.82rem; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .srow .scode { font-family: var(--mono); color: var(--ink-faint); font-size: 0.78rem; }

  /* Multi-date picker */
  .cal { border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 10px; max-width: 420px; }
  .invalid .cal { border-color: var(--unavailable); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .cal-title { font-family: var(--display); font-weight: 600; font-size: 1rem; }
  .cal-nav { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 1rem; }
  .cal-nav:disabled { opacity: 0.35; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal-wd { border: none; background: transparent; font-family: var(--sans); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-dim); padding: 4px 0; border-radius: 6px; cursor: pointer; }
  .cal-wd:hover { color: var(--accent); background: var(--accent-soft); }
  .cal-day { position: relative; aspect-ratio: 1 / 1; min-height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; font-family: var(--mono); font-size: 0.86rem; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; }
  .cal-day:hover:not(:disabled) { border-color: var(--accent); }
  .cal-day:disabled { background: transparent; border-color: transparent; color: var(--ink-faint); cursor: default; font-weight: 500; }
  .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--ink-faint); }
  .cal-day.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .cal-day .cal-dot { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 50%; }
  .cal-day.sel .cal-dot { box-shadow: 0 0 0 1.5px var(--accent-ink); }
  .cal-blank { aspect-ratio: 1 / 1; }
  .cal-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .cal-quick .btn { padding: 6px 11px; font-size: 0.78rem; }
  .cal-summary { font-size: 0.84rem; color: var(--ink-dim); margin-top: 8px; }
  .cal-summary strong { color: var(--ink); }
  .cal-key { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.74rem; color: var(--ink-dim); margin-top: 8px; }
  .cal-key span { display: inline-flex; align-items: center; gap: 5px; }
  .cal-key i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .clash-box { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--available-soft); border: 1px solid var(--available); font-size: 0.84rem; display: flex; flex-direction: column; gap: 6px; }
  .clash-box .checkline { font-size: 0.84rem; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--ink); }
  .banner.ok { background: var(--accent-soft); color: var(--accent); }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark">Roster Ledger</div>
      <div class="tag">Staff availability, kept in one place</div>
    </div>
    <div class="admin-badge" id="adminBadge" hidden>Admin</div>
  </header>

  <div id="app"></div>
</div>
<div class="lock-toast" id="lockToast" role="status" aria-live="polite" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  "use strict";

  var STATUS_LABEL = { available: "Available", unavailable: "Unavailable", partial: "Partial availability" };
  var STATUS_SHORT_LABEL = { available: "Available", unavailable: "Unavailable", partial: "Partial" };
  var STATUS_ORDER = ["available", "unavailable", "partial"];
  function pillClassFor(st) { return st === "available" ? "pill-available" : st === "partial" ? "pill-partial" : "pill-unavailable"; }
  var DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

  // ---------- Shifts ----------
  // Edit the labels or times here if your shifts ever change.
  // An empty `end` means "onwards" (until close).
  var SHIFTS = [
    { id: "day", label: "Day Shift", short: "Day", hours: "7am – 3pm", start: "07:00", end: "15:00" },
    { id: "sundowner", label: "Sundowner Shift", short: "Sundowner", hours: "3pm onwards", start: "15:00", end: "" }
  ];
  var SHIFT_BY_ID = {};
  SHIFTS.forEach(function (s) { SHIFT_BY_ID[s.id] = s; });

  // Which shift(s) an entry belongs to. Entries saved before shifts existed
  // have no `shift`: whole-day ones count for every shift, timed ones for the
  // shift(s) their times overlap.
  function entryShiftList(e) {
    if (e.shift && SHIFT_BY_ID[e.shift]) return [e.shift];
    if (e.allDay || (!e.start && !e.end)) return SHIFTS.map(function (s) { return s.id; });
    var st = e.start || "00:00", en = e.end || "24:00", out = [];
    SHIFTS.forEach(function (s) { if (st < (s.end || "24:00") && en > s.start) out.push(s.id); });
    return out.length ? out : [SHIFTS[0].id];
  }
  // Copy of an old (no-shift) entry for one shift, times clipped to that shift.
  function legacyToShift(e, shiftId) {
    var s = SHIFT_BY_ID[shiftId];
    var c = { id: e.id + "-" + shiftId, date: e.date, shift: shiftId, status: e.status, note: e.note || "", allDay: true, start: "", end: "", updatedAt: e.updatedAt || Date.now() };
    if (!e.allDay && (e.start || e.end)) {
      var st = e.start && e.start > s.start ? e.start : s.start;
      var en = (e.end || "24:00") < (s.end || "24:00") ? e.end : (s.end || "");
      if (!(st === s.start && (en || "") === (s.end || ""))) { c.allDay = false; c.start = st; c.end = en || ""; }
    }
    return c;
  }
  // Since the Partial option exists, an Available/Unavailable entry with
  // times becomes "Partial availability", with the times kept in the note.
  function normalizeStatus(e) {
    if (e.status === "partial" || e.allDay || (!e.start && !e.end)) return e;
    var c = {};
    Object.keys(e).forEach(function (k) { c[k] = e[k]; });
    var when = STATUS_LABEL[e.status] + " " + entryTimeLabel(e).replace(/^From /, "from ").replace(/^Until /, "until ");
    c.status = "partial";
    // Times stay in From/To; the note only needs to say more when it helps.
    c.note = (e.note ? (e.status === "unavailable" ? when + " — " + e.note : e.note) : when).slice(0, 140);
    return c;
  }
  function entriesForShift(entries, shiftId) {
    var out = [];
    (entries || []).forEach(function (e) {
      if (entryShiftList(e).indexOf(shiftId) < 0) return;
      out.push(normalizeStatus(e.shift ? e : legacyToShift(e, shiftId)));
    });
    return out;
  }
  // Converts every old entry into one entry per shift. Returns {entries, changed}.
  function migrateLegacy(entries) {
    var out = [], changed = false;
    (entries || []).forEach(function (e) {
      if (e.shift && SHIFT_BY_ID[e.shift]) {
        var n = normalizeStatus(e);
        if (n !== e) changed = true;
        out.push(n); return;
      }
      changed = true;
      entryShiftList(e).forEach(function (sid) { out.push(normalizeStatus(legacyToShift(e, sid))); });
    });
    return { entries: out, changed: changed };
  }
  function entryTimeLabel(e) {
    if (e.allDay || (!e.start && !e.end)) return e.status === "partial" ? "" : "Whole shift";
    if (e.start && e.end) return formatTime(e.start) + " – " + formatTime(e.end);
    if (e.start) return "From " + formatTime(e.start);
    return "Until " + formatTime(e.end);
  }

  var state = {
    tab: isAdminUrl() ? "owner" : "staff",
    staffCode: safeGet("roster_staff_code"),
    staffName: safeGet("roster_staff_name"),
    ownerUnlocked: false, // never remembered — the PIN is needed every time
    db: null,
    dbReady: false,
    staffDocs: [],       // [{code, name, createdAt}]
    availByCode: {},     // code -> entries[]
    weekStart: startOfWeek(new Date()),
    staffScreen: "loading", // loading | enter-code | editor
    ownerScreen: "loading", // loading | setup-pin | pin | dashboard | error
    dbError: "",
    formError: "",
    editingId: null,
    staffShift: "day",
    fieldErrors: null,
    pickDates: {},        // multi-date picker: iso -> true
    calMonth: null,       // first day of the month shown in the picker
    replaceExisting: false,
    formMsg: "",
    adminShift: "both",
    adminMsg: "",
    adminMsgError: false,
    confirmRemove: null,
    confirmMergeGroup: null,
    mergeFrom: null,
    mergeInto: "",
    exportRange: "1",
    exporting: false,
    exportError: "",
    importData: null,
    importSource: "grid",
    importMode: "add",
    importDefaultShift: "day",
    importCreateNew: true,
    importBusy: false,
    importError: "",

  // The admin dashboard only opens from the admin link (…/#admin).
  // The normal link shows the Staff screen only, with no way to reach Admin.
  function isAdminUrl() {
    return /(^|[#&?])admin\b/i.test(location.hash || "") || /[?&]admin\b/i.test(location.search || "");
  }
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function safeDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function toISODate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function startOfWeek(d) {
    var x = new Date(d);
    var day = x.getDay(); // 0 Sun .. 6 Sat
    var diff = (day === 0 ? -6 : 1 - day); // back to Monday
    x.setDate(x.getDate() + diff);
    x.setHours(0, 0, 0, 0);
    return x;
  }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function formatDateLong(iso) {
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  function formatDayNum(d) { return d.getDate(); }
  function formatTime(hhmm) {
    if (!hhmm) return "";
    var parts = hhmm.split(":");
    var h = parseInt(parts[0], 10), m = parts[1];
    var ap = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + m + " " + ap;
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function genCode() {
    var s = "";
    for (var i = 0; i < 6; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
    return s;
  }
  function uid() { return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // ---------- render root ----------
  function render() {
    document.getElementById("adminBadge").hidden = state.tab !== "owner";
    var app = document.getElementById("app");
    app.innerHTML = state.tab === "staff" ? renderStaffTab() : renderOwnerTab();
    bindHandlers();
  }

  // ---------- STAFF TAB ----------
  function renderStaffTab() {
    if (!state.dbReady) return cardLoading();
    if (state.staffScreen === "enter-code") return renderEnterCode();
    if (state.staffScreen === "editor") return renderEditor();
    return cardLoading();
  }

  function cardLoading() {
    return '<div class="card"><p class="muted">Loading…</p></div>';

  function renderEnterCode() {
    return (
      '<div class="card">' +
        '<h2>Sign in</h2>' +
        '<p class="muted">Enter the personal access code your manager gave you. Don\'t have one yet? Ask your manager.</p>' +
        (state.formError ? '<div class="banner error" style="margin-top:10px;">' + escapeHtml(state.formError) + '</div>' : '') +
        '<form id="formCode" style="margin-top:14px;">' +

          '<div class="row">' +

          '</div>' +

      '</div>'

  }

  function renderEditor() {
    var all = state.availByCode[state.staffCode] || [];
    var shift = SHIFT_BY_ID[state.staffShift] || SHIFTS[0];
    var entries = entriesForShift(all, shift.id).sort(byDateThenStart);
    var todayISO = toISODate(new Date());
    var showPast = state.showPast;
    var visible = entries.filter(function (e) { return showPast || e.date >= todayISO; });

    var listHtml = visible.length
      ? '<div class="entry-list">' + visible.map(renderEntryRow).join("") + '</div>'
      : '<div class="empty">No ' + escapeHtml(shift.label) + ' availability yet. Use the form above to add some.</div>';

    var tabs = '<div class="shift-tabs" role="tablist">' + SHIFTS.map(function (s) {
      var n = entriesForShift(all, s.id).filter(function (e) { return e.date >= todayISO; }).length;
      var on = s.id === shift.id;
      return '<button type="button" role="tab" aria-selected="' + on + '" class="shift-tab' + (on ? ' active' : '') + '" data-shift-tab="' + s.id + '">' +
        '<span class="st-name">' + escapeHtml(s.label) + '</span>' +
        '<span class="st-hours">' + escapeHtml(s.hours) + (n ? ' · ' + n + ' upcoming' : '') + '</span></button>';
    }).join("") + '</div>';

    return (
      '<div class="card">' +
        '<div class="toprow">' +
          '<div><h2>Hi, ' + escapeHtml(state.staffName || "") + '</h2><p class="muted">Your code is <strong style="font-family:var(--mono);letter-spacing:0.08em;">' + escapeHtml(state.staffCode) + '</strong> — keep it somewhere safe.</p></div>' +
          '<button class="link-btn" id="btnSwitchStaff">Not you? Switch account</button>' +
        '</div>' +
      '</div>' +

      tabs +

      '<div class="card">' +
        '<h2>' + (state.editingId ? "Edit " : "Add ") + escapeHtml(shift.label) + ' availability</h2>' +
        '<p class="muted">' + escapeHtml(shift.label) + ' runs ' + escapeHtml(shift.hours) + '. ' +
          (state.editingId
            ? 'Change the date or option, then save. '
            : 'Tap every date this applies to — as many as you like — then choose one option for all of them. ') +
          'If you choose Partial availability, add a note. Fields marked <span class="req">*</span> are required.</p>' +
        (state.formError ? '<div class="banner error" style="margin-top:10px;">' + escapeHtml(state.formError) + '</div>' : '') +
        (state.formMsg && !state.formError ? '<div class="banner ok" style="margin-top:10px;" role="status">' + escapeHtml(state.formMsg) +
          (state.lastDates && state.lastDates.length && state.lastShift === shift.id && SHIFTS.length > 1
            ? ' ' + SHIFTS.filter(function (s) { return s.id !== shift.id; }).map(function (s) {
                return '<button type="button" class="link-btn" data-reuse-shift="' + s.id + '">Pick the same dates for ' + escapeHtml(s.label) + '</button>';
              }).join(" ")
            : '') +
          '</div>' : '') +
        renderEntryForm(state.editingId ? findEntry(entries, state.editingId) : null, shift) +
      '</div>' +

      '<div class="card">' +
        '<div class="toprow">' +
          '<h2 style="margin:0;">Your ' + escapeHtml(shift.label) + ' availability</h2>' +
          '<label class="checkline"><input type="checkbox" id="chkShowPast" ' + (showPast ? "checked" : "") + '> Show past dates</label>' +
        '</div>' +
        '<div style="margin-top:12px;">' + listHtml + '</div>' +
      '</div>'
    );
  }

  function findEntry(entries, id) {
    for (var i = 0; i < entries.length; i++) if (entries[i].id === id) return entries[i];
    return null;
  }

  function renderEntryForm(existing, shift) {
    var e = state.entryDraft || existing || { date: "", status: "", start: "", end: "", note: "" };
    var fe = state.fieldErrors || {};
    var isPartial = e.status === "partial";
    var openEnded = !shift.end;
    var opt = function (val, label, colorVar) {
      var on = e.status === val;
      return '<label class="status-opt' + (on ? ' sel-' + val : '') + '"><input type="radio" name="fStatus" value="' + val + '"' + (on ? " checked" : "") + '>' +
        '<span class="sdot" style="background:var(' + colorVar + ');"></span>' + label + '</label>';
    };
    return (
      '<form id="formEntry" novalidate data-editing="' + (existing ? existing.id : "") + '">' +
        (existing
          ? '<div class="field' + (fe.date ? " invalid" : "") + '"><label for="fDate">Date <span class="req">*</span></label>' +
              '<input type="date" id="fDate" required value="' + escapeHtml(e.date) + '">' +
              (fe.date ? '<span class="field-err">' + escapeHtml(fe.date) + '</span>' : '') + '</div>'
          : '<div class="field' + (fe.date ? " invalid" : "") + '"><label id="calLabel">Dates <span class="req">*</span></label>' +
              '<div id="calBox" role="group" aria-labelledby="calLabel">' + renderCalendar(shift) + '</div>' +
              (fe.date ? '<span class="field-err">' + escapeHtml(fe.date) + '</span>' : '') + '</div>') +
        '<fieldset class="status-choice' + (fe.status ? " invalid" : "") + '"><legend>Availability <span class="req">*</span></legend>' +
          '<div class="status-opts">' +
            opt("available", "Available", "--available") +
            opt("unavailable", "Unavailable", "--unavailable") +
            opt("partial", "Partial availability", "--partial") +
          '</div>' +
          (fe.status ? '<span class="field-err">' + escapeHtml(fe.status) + '</span>' : '') +
        '</fieldset>' +
        '<div id="partialBox" style="display:' + (isPartial ? "flex" : "none") + ';flex-direction:column;gap:12px;">' +
          '<div class="field' + (fe.note ? " invalid" : "") + '"><label for="fNote">Note — what can you do? <span class="req">*</span></label>' +
            '<textarea id="fNote" maxlength="140" placeholder="e.g. Can only work 9am – 1pm, school pickup at 2pm">' + escapeHtml(isPartial ? (e.note || "") : "") + '</textarea>' +
            (fe.note ? '<span class="field-err">' + escapeHtml(fe.note) + '</span>' : '') + '</div>' +
          '<div class="row">' +
            '<div class="field' + (fe.time ? " invalid" : "") + '"><label for="fStart">From (optional)</label><input type="time" id="fStart" value="' + escapeHtml(isPartial ? (e.start || "") : "") + '"></div>' +
            '<div class="field' + (fe.time ? " invalid" : "") + '"><label for="fEnd">To (optional)</label><input type="time" id="fEnd" value="' + escapeHtml(isPartial ? (e.end || "") : "") + '"></div>' +
          '</div>' +
          (fe.time ? '<span class="field-err">' + escapeHtml(fe.time) + '</span>' : '<span class="muted" style="font-size:0.78rem;">Times are optional. ' + escapeHtml(shift.label) + ' is ' + escapeHtml(shift.hours) + (openEnded ? '. Leave “To” blank for “until close”.' : '.') + '</span>') +
        '</div>' +
        '<div class="row">' +
          '<button type="submit" class="btn btn-primary" id="btnSubmitEntry">' + (existing ? "Save changes" : escapeHtml(addButtonLabel(shift))) + '</button>' +
          (existing ? '<button type="button" class="btn btn-ghost" id="btnCancelEdit">Cancel</button>' : '') +
        '</div>' +
      '</form>'
    );
  }

  // ---------- Multi-date picker ----------
  var MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var WEEKDAY_FULL = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  var CAL_MONTHS_AHEAD = 12;

  function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  function pickedList() {
    var today = toISODate(new Date());
    return Object.keys(state.pickDates).filter(function (d) { return state.pickDates[d] && d >= today; }).sort();
  }
  function existingByDate(shiftId) {
    var map = {};
    entriesForShift(state.availByCode[state.staffCode] || [], shiftId).forEach(function (e) { map[e.date] = e.status; });
    return map;
  }
  function addButtonLabel(shift) {
    var n = pickedList().length;
    if (n <= 1) return "Add to " + shift.label;
    return "Add " + n + " dates to " + shift.label;
  }
  function pickLabel(iso) {
    var d = new Date(iso + "T00:00:00");
    return DAY_NAMES[(d.getDay() + 6) % 7] + " " + d.getDate() + " " + MONTH_NAMES[d.getMonth()].slice(0, 3);
  }

  function renderCalendar(shift) {
    var now = new Date();
    var todayISO = toISODate(now);
    var minMonth = firstOfMonth(now);
    var maxMonth = new Date(minMonth.getFullYear(), minMonth.getMonth() + CAL_MONTHS_AHEAD, 1);
    if (!state.calMonth || state.calMonth < minMonth) state.calMonth = minMonth;
    if (state.calMonth > maxMonth) state.calMonth = maxMonth;
    var m = state.calMonth;
    var have = existingByDate(shift.id);
    var lead = (m.getDay() + 6) % 7; // Monday-first
    var daysIn = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();

    var cells = "";
    for (var w = 0; w < 7; w++) {
      cells += '<button type="button" class="cal-wd" data-cal-wd="' + w + '" title="Select every ' + WEEKDAY_FULL[w] + ' left in ' + MONTH_NAMES[m.getMonth()] + '" aria-label="Select every ' + WEEKDAY_FULL[w] + ' left in ' + MONTH_NAMES[m.getMonth()] + '">' + DAY_NAMES[w] + '</button>';
    }
    for (var b = 0; b < lead; b++) cells += '<span class="cal-blank"></span>';
    for (var i = 1; i <= daysIn; i++) {
      var iso = toISODate(new Date(m.getFullYear(), m.getMonth(), i));
      var past = iso < todayISO;
      var sel = !past && !!state.pickDates[iso];
      var st = have[iso];
      var label = formatDateLong(iso) + (st ? " — already " + STATUS_LABEL[st] : "") + (sel ? ", selected" : "");
      cells += '<button type="button" class="cal-day' + (sel ? " sel" : "") + (iso === todayISO ? " today" : "") + '"' +
        (past ? " disabled" : ' data-cal-day="' + iso + '"') +
        ' aria-pressed="' + sel + '" aria-label="' + escapeHtml(label) + '">' + i +
        (st ? '<span class="cal-dot" style="background:var(--' + st + ');"></span>' : '') + '</button>';
    }

    var picked = pickedList();
    var clashes = picked.filter(function (d) { return have[d]; });
    var summary = picked.length
      ? '<strong>' + picked.length + ' date' + (picked.length === 1 ? "" : "s") + ' selected:</strong> ' +
        escapeHtml(picked.slice(0, 6).map(pickLabel).join(", ")) + (picked.length > 6 ? " +" + (picked.length - 6) + " more" : "")
      : 'No dates selected yet. Tap a day, or tap a weekday name to pick every one of those days this month.';

    return (
      '<div class="cal">' +
        '<div class="cal-head">' +
          '<button type="button" class="cal-nav" data-cal-nav="-1" aria-label="Previous month"' + (m <= minMonth ? " disabled" : "") + '>‹</button>' +
          '<span class="cal-title" aria-live="polite">' + MONTH_NAMES[m.getMonth()] + ' ' + m.getFullYear() + '</span>' +
          '<button type="button" class="cal-nav" data-cal-nav="1" aria-label="Next month"' + (m >= maxMonth ? " disabled" : "") + '>›</button>' +
        '</div>' +
        '<div class="cal-grid">' + cells + '</div>' +
        '<div class="cal-key">' +
          '<span><i style="background:var(--accent);"></i>Selected</span>' +
          '<span><i style="background:var(--available);"></i>Already Available</span>' +
          '<span><i style="background:var(--unavailable);"></i>Already Unavailable</span>' +
          '<span><i style="background:var(--partial);"></i>Already Partial</span>' +
        '</div>' +
      '</div>' +
      '<div class="cal-quick">' +
        '<button type="button" class="btn btn-ghost" data-cal-quick="thisweek">Rest of this week</button>' +
        '<button type="button" class="btn btn-ghost" data-cal-quick="nextweek">Next week</button>' +
        '<button type="button" class="btn btn-ghost" data-cal-quick="month">Rest of this month</button>' +
        (picked.length ? '<button type="button" class="btn btn-ghost" data-cal-quick="clear">Clear</button>' : '') +
      '</div>' +
      '<div class="cal-summary" aria-live="polite">' + summary + '</div>' +
      (clashes.length
        ? '<div class="clash-box">' +
            '<span>' + clashes.length + ' of these date' + (clashes.length === 1 ? " already has" : "s already have") + ' a ' + escapeHtml(shift.label) + ' entry (' + escapeHtml(clashes.slice(0, 4).map(pickLabel).join(", ")) + (clashes.length > 4 ? "…" : "") + ').</span>' +
            '<label class="checkline"><input type="checkbox" id="chkReplace"' + (state.replaceExisting ? " checked" : "") + '> Replace ' + (clashes.length === 1 ? "it" : "them") + ' with what I choose below</label>' +
            '<span class="muted" style="font-size:0.78rem;">Leave unticked to keep ' + (clashes.length === 1 ? "that entry" : "those entries") + ' and only add the new dates.</span>' +
          '</div>'
        : '')
    );
  }

  function refreshCalendar() {
    var box = document.getElementById("calBox");
    if (!box) return;
    var shift = SHIFT_BY_ID[state.staffShift] || SHIFTS[0];
    box.innerHTML = renderCalendar(shift);
    var btn = document.getElementById("btnSubmitEntry");
    if (btn) btn.textContent = addButtonLabel(shift);
    // A fresh pick clears the "picked no dates" error and old success message.
    if (state.fieldErrors && state.fieldErrors.date && pickedList().length) {
      state.fieldErrors.date = null;
      var f = box.closest(".field"); if (f) { f.classList.remove("invalid"); var er = f.querySelector(".field-err"); if (er) er.remove(); }
    }
  }

  function onCalendarClick(ev) {
    var t = ev.target.closest("button");
    if (!t || t.disabled) return;
    var todayISO = toISODate(new Date());
    state.formMsg = "";
    if (t.hasAttribute("data-cal-day")) {
      var iso = t.getAttribute("data-cal-day");
      if (state.pickDates[iso]) delete state.pickDates[iso]; else state.pickDates[iso] = true;
    } else if (t.hasAttribute("data-cal-nav")) {
      var m = state.calMonth;
      state.calMonth = new Date(m.getFullYear(), m.getMonth() + parseInt(t.getAttribute("data-cal-nav"), 10), 1);
    } else if (t.hasAttribute("data-cal-wd")) {
      // Toggle every future <weekday> in the month on screen.
      var wd = parseInt(t.getAttribute("data-cal-wd"), 10), mm = state.calMonth, list = [];
      var n = new Date(mm.getFullYear(), mm.getMonth() + 1, 0).getDate();
      for (var i = 1; i <= n; i++) {
        var d = new Date(mm.getFullYear(), mm.getMonth(), i);
        var di = toISODate(d);
        if ((d.getDay() + 6) % 7 === wd && di >= todayISO) list.push(di);
      }
      setRange(list);
    } else if (t.hasAttribute("data-cal-quick")) {
      var q = t.getAttribute("data-cal-quick"), now = new Date(), from, to;
      if (q === "clear") { state.pickDates = {}; state.replaceExisting = false; }
      else {
        if (q === "thisweek") { from = now; to = addDays(startOfWeek(now), 6); }
        else if (q === "nextweek") { from = addDays(startOfWeek(now), 7); to = addDays(from, 6); }
        else { from = now; to = new Date(now.getFullYear(), now.getMonth() + 1, 0); }
        var r = [];
        for (var x = new Date(from.getFullYear(), from.getMonth(), from.getDate()); x <= to; x = addDays(x, 1)) r.push(toISODate(x));
        setRange(r);
        state.calMonth = firstOfMonth(from);
      }
    }
    refreshCalendar();
  }
  // Adds all the given dates; if they were all already picked, removes them instead.
  function setRange(list) {
    var allOn = list.length && list.every(function (d) { return state.pickDates[d]; });
    list.forEach(function (d) { if (allOn) delete state.pickDates[d]; else state.pickDates[d] = true; });
  }

  function renderEntryRow(e) {
    var t = entryTimeLabel(e);
    return (
      '<div class="entry-row">' +
        '<span class="entry-date">' + formatDateLong(e.date) + '</span>' +
        '<span class="pill ' + pillClassFor(e.status) + '"><span class="pill-dot"></span>' + STATUS_LABEL[e.status] + '</span>' +
        (t ? '<span class="entry-time">' + escapeHtml(t) + '</span>' : '') +
        '<span class="entry-actions">' +
          '<button class="icon-btn" data-edit="' + e.id + '" title="Edit" aria-label="Edit">✎</button>' +
          '<button class="icon-btn" data-del="' + e.id + '" title="Delete" aria-label="Delete">🗑</button>' +
        '</span>' +
        (e.note ? '<span class="entry-note">' + escapeHtml(e.note) + '</span>' : '') +
      '</div>'
    );
  }
