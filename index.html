  function bindImportHandlers() {
    var f = document.getElementById("importFile");
    if (f) {
      f.onclick = pauseIdleForPicker;
      f.onchange = function () { resumeIdle(); if (this.files && this.files[0]) readImportFile(this.files[0]); };
    }
    var src = document.getElementById("impSource");
    if (src) src.onchange = function () { state.importSource = this.value; render(); };
    var ish = document.getElementById("impShift");
    if (ish) ish.onchange = function () { state.importDefaultShift = this.value; render(); };
    document.querySelectorAll('input[name="impMode"]').forEach(function (r) {
      r.onchange = function () { state.importMode = this.value; render(); };
    });
    var cn = document.getElementById("impCreateNew");
    if (cn) cn.onchange = function () { state.importCreateNew = this.checked; render(); };
    var run = document.getElementById("btnRunImport");
    if (run) run.onclick = runImport;
    var cancel = document.getElementById("btnCancelImport");
    if (cancel) cancel.onclick = function () { state.importData = null; state.importError = ""; render(); };
  }

  // ---------- admin: staff management ----------
  function setAdminMsg(msg, isError) { state.adminMsg = msg; state.adminMsgError = !!isError; }

  function onSubmitAddStaff(ev) {
    ev.preventDefault();
    var name = document.getElementById("addName").value.trim();
    var raw = document.getElementById("addCode").value.trim().toUpperCase();
    var code = raw.replace(/[^A-Z0-9]/g, "");
    if (!name) return;
    if (raw && code !== raw) { setAdminMsg("Codes can only use letters and numbers (no spaces or symbols).", true); render(); return; }
    if (code && (code.length < 4 || code.length > 16)) { setAdminMsg("Codes need to be 4–16 letters or numbers.", true); render(); return; }
    var same = state.staffDocs.filter(function (s) { return normName(s.name) === normName(name); })[0];
    if (same) {
      setAdminMsg(same.name + " is already on the list with code " + same.code + ". Each person should have only one code. If this is a different person with the same name, add a surname or initial (e.g. “Sam L.”).", true);
      render(); return;
    }
    var pick = code ? Promise.resolve(code) : findFreeCode(0);
    pick.then(function (c) {
      return state.db.collection("staff").doc(c).get().then(function (snap) {
        if (snap.exists) {
          var who = (snap.data() && snap.data().name) || "someone else";
          setAdminMsg("Code " + c + " is already used by " + who + ". Choose a different one.", true);
          render();
          return;
        }
        return state.db.collection("staff").doc(c).set({ name: name, code: c, createdAt: Date.now() }).then(function () {
          setAdminMsg("Added " + name + " with code " + c + ". Give them this code so they can sign in.", false);
          render();
        });
      });
    }).catch(function () {
      setAdminMsg("Couldn't add that person just now. Please try again.", true);
      render();
    });
  }

  function clearStaffActions() {
    state.confirmRemove = null; state.confirmMergeGroup = null; state.mergeFrom = null; state.mergeInto = "";
  }

  // Moves every entry from the `fromCodes` rows into `intoCode`, skipping exact
  // duplicates, then deletes the extra staff rows so their codes stop working.
  // Picks the neatest spelling in a group: has capitals, then the longest.
  function bestName(rows) {
    var names = rows.map(function (r) { return String(r.name || "").trim().replace(/\s+/g, " "); });
    names.sort(function (a, b) {
      var ca = /[A-Z]/.test(a) ? 1 : 0, cb = /[A-Z]/.test(b) ? 1 : 0;
      return (cb - ca) || (b.length - a.length);
    });
    return names[0];
  }

  function mergeStaff(fromCodes, intoCode, newName) {
    var target = state.staffDocs.filter(function (s) { return s.code === intoCode; })[0];
    if (!target) return;
    fromCodes = fromCodes.filter(function (c) { return c && c !== intoCode; });
    if (!fromCodes.length) return;
    var merged = migrateLegacy(state.availByCode[intoCode] || []).entries, seen = {}, moved = 0, dupes = 0;
    merged.forEach(function (e) { seen[entryKey(e)] = true; });
    fromCodes.forEach(function (c) {
      migrateLegacy(state.availByCode[c] || []).entries.forEach(function (e) {
        var k = entryKey(e);
        if (seen[k]) { dupes++; return; }
        seen[k] = true; moved++;
        merged.push(e);
      });
    });
    merged.sort(byDateThenStart);
    var finalName = newName || target.name;
    var renameP = finalName !== target.name
      ? state.db.collection("staff").doc(intoCode).set({ name: finalName, code: intoCode, createdAt: target.createdAt || Date.now() })
      : Promise.resolve();
    target = { name: finalName, code: intoCode };
    renameP.then(function () {
      return state.db.collection("availability").doc(intoCode).set({ code: intoCode, name: finalName, entries: merged, updatedAt: Date.now() });
    }).then(function () {
      var dels = [];
      fromCodes.forEach(function (c) {
        dels.push(state.db.collection("staff").doc(c).delete());
        dels.push(state.db.collection("availability").doc(c).delete());
      });
      return Promise.all(dels);
    }).then(function () {
      clearStaffActions();
      setAdminMsg("Merged into " + target.name + " (" + intoCode + "): " + moved + " " + (moved === 1 ? "entry" : "entries") + " moved" +
        (dupes ? ", " + dupes + " exact duplicate" + (dupes === 1 ? "" : "s") + " dropped" : "") +
        ". Code" + (fromCodes.length === 1 ? " " : "s ") + fromCodes.join(", ") + (fromCodes.length === 1 ? " no longer works" : " no longer work") +
        " — tell " + target.name + " to use " + intoCode + ".", false);
      render();
    }).catch(function () {
      clearStaffActions();
      setAdminMsg("The merge didn't finish because the database couldn't be reached. Nothing was deleted until entries were saved, so it's safe to try again.", true);
      render();
    });
  }

  function findFreeCode(attempt) {
    if (attempt > 6) return Promise.reject(new Error("no free code"));
    var c = genCode();
    return state.db.collection("staff").doc(c).get().then(function (snap) {
      return snap.exists ? findFreeCode(attempt + 1) : c;
    });
  }

  function removeStaff(code) {
    var person = null;
    state.staffDocs.forEach(function (s) { if (s.code === code) person = s; });
    Promise.all([
      state.db.collection("staff").doc(code).delete(),
      state.db.collection("availability").doc(code).delete()
    ]).then(function () {
      state.confirmRemove = null;
      setAdminMsg("Removed " + ((person && person.name) || code) + ". Their code no longer works.", false);
      render();
    }).catch(function () {
      state.confirmRemove = null;
      setAdminMsg("Couldn't remove that person just now. Please try again.", true);
      render();
    });
  }


  function subscribeOwnerDashboard() {
    if (!staffCollUnsub) {
      staffCollUnsub = state.db.collection("staff").onSnapshot(function (snap) {
        state.staffDocs = snap.docs.map(function (d) { return d.data(); });
        if (state.tab === "owner") render();
      }, function () {});
    }
    if (!availCollUnsub) {
      availCollUnsub = state.db.collection("availability").onSnapshot(function (snap) {
        var map = {};
        snap.docs.forEach(function (d) {
          var data = d.data();
          map[d.id] = data.entries || [];
        });
        state.availByCode = map;
        if (state.tab === "owner") render();
      }, function () {});
    }
  }
  function unsubOwnerDashboard() {
    if (staffCollUnsub) { staffCollUnsub(); staffCollUnsub = null; }
    if (availCollUnsub) { availCollUnsub(); availCollUnsub = null; }
  }

  // ---------- Firebase adapter ----------
  // Wraps the Firebase compat SDK so the rest of this file (copied straight
  // from the Claude.ai version) can call .get()/.set()/.onSnapshot() exactly
  // as before, without knowing it's talking to Firestore underneath.
  function makeFirebaseDbAdapter(firestore) {
    function wrapDocSnap(s) {
      return { id: s.id, exists: s.exists, data: function () { return s.data(); } };
    }
    function wrapQuerySnap(qs) {
      return { docs: qs.docs.map(wrapDocSnap) };
    }
    function wrapDocRef(ref) {
      return {
        id: ref.id,
        get: function () { return ref.get().then(wrapDocSnap); },
        set: function (data) { return ref.set(data); },
        delete: function () { return ref.delete(); },
        onSnapshot: function (next, err) {
          return ref.onSnapshot(function (s) { next(wrapDocSnap(s)); }, err || function () {});
        },
        collection: function (p) { return wrapCollRef(ref.collection(p)); }
      };
    }
    function wrapCollRef(ref) {
      return {
        doc: function (id) { return wrapDocRef(id ? ref.doc(id) : ref.doc()); },
        add: function (data) { return ref.add(data).then(wrapDocRef); },
        get: function () { return ref.get().then(wrapQuerySnap); },
        onSnapshot: function (next, err) {
          return ref.onSnapshot(function (qs) { next(wrapQuerySnap(qs)); }, err || function () {});
        }
      };
    }
    return {
      doc: function (path) { return wrapDocRef(firestore.doc(path)); },
      collection: function (path) { return wrapCollRef(firestore.collection(path)); }
    };
  }
